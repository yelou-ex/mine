<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人简历</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-image: url("picture/d3SJaPgZhqMVOQv.thumb.png");
            background-size: cover;
			background-attachment: fixed;
			background-repeat: no-repeat;
            line-height: 1.6;
        }
        
        .container {
			opacity: 0.8;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .profile-section {
            background-color: white;
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        h2 {
            color: #6e8efb;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        p {
            margin-bottom: 15px;
        }
        
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .skill {
            background-color: #f0f0f0;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .project {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .project h3 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .contact-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        button {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s ease;
        }
		
		nav ul {
            display: flex;
            list-style: none;
        }
        
        nav ul li {
            margin-left: 20px;
        }
        
        nav ul li a {
            color: #2c3e50;
            font-weight: 500;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        nav ul li a:hover {
            background-color: #ecf0f1;
        }
        
        button:hover {
            background: linear-gradient(135deg, #5a7df7, #9367d1);
        }
        
        .footer {
             background-color: #2c3e50;
            color: #ecf0f1;
            padding: 30px 0;
            text-align: center;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        
        .social-links a {
            color: #6e8efb;
            font-size: 1.2rem;
            text-decoration: none;
        }
        
        @media (max-width : 760px ){
            .contact-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>杨楼&nbsp;</h1>
            <p>天地本宽，而鄙者自愚；风花雪月本闲，而扰攘者自冗&nbsp;</p>
			<nav>
                    <ul>
                        <li><a href="index.html" style="text-decoration: none">首页</a></li>
                    </ul>
                </nav>
        </header>
        
        <section class="profile-section">
          <h2>个人简介</h2>
          <p>你好，我叫杨楼，是西安电子科技大学的一名学生</p>
            <p>来自贵州遵义&nbsp;</p>
<p>注重行事效率，讨厌形式主义&nbsp;</p>
          <p>性格时i时e</p>
            <p>各种游戏都有在玩&nbsp;</p>
        </section>
        
        <section class="profile-section">
          <h2>特长爱好&nbsp;</h2>
            <div class="skills-container">
                <span class="skill">篮球&nbsp;</span>
                <span class="skill">听歌&nbsp;</span>
                <span class="skill">游戏&nbsp;</span>
            </div>
      </section>
<section class="profile-section">
    <h2>教育背景</h2>
            <div class="education">
                <h3>西安电子科技大学&nbsp;</h3>
                <p><strong>专业：网络空间安全</strong></p>
                <p><strong>时间：2024 ——&nbsp;</strong></p>
                <p>&nbsp;</p>
            </div>
        </section>
        
        <section class="profile-section">
            <h2>联系我</h2>
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">姓名</label>
                    <input type="text" id="name" name="name" placeholder="请输入您的姓名">
                </div>
                
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" placeholder="请输入您的邮箱">
                </div>
                
                <div class="form-group" style="grid-column: span 2;">
                    <label for="message">留言</label>
                    <textarea id="message" name="message" placeholder="请输入您的留言内容"></textarea>
                </div>
                
                <div style="grid-column: span 2; text-align: right;">
                    <button type="submit">发送留言</button>
                </div>
            </form>
        </section>
    </div>
    
    <footer class="footer">
        <p>© [2025] [杨楼]. 保留所有权利。</p>
    </footer>

    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('留言功能需要后端支持，当前仅为示例。在实际应用中，您需要设置服务器端脚本来处理表单提交。');
        });
    </script>
</body>
</html>
