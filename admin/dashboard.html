<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="cache-control" content="no-cache, no-store, must-revalidate">
    <meta name="pragma" content="no-cache">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>后台管理 - 个人主页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', 'Microsoft YaHei', sans-serif; }
        body { background: #f4f6f8; min-height: 100vh; }
        .topbar {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,.15);
        }
        .topbar .brand { font-size: 17px; font-weight: 700; }
        .topbar .brand a { color: #ecf0f1; text-decoration: none; }
        .topbar .user-area { display: flex; align-items: center; gap: 14px; font-size: 13px; }
        .topbar .btn-logout {
            background: #e74c3c;
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }
        .topbar .btn-logout:hover { background: #c0392b; }
        .tabs {
            background: #fff;
            border-bottom: 1px solid #e1e6ea;
            display: flex;
            padding: 0 24px;
        }
        .tabs button {
            border: none;
            background: none;
            padding: 14px 22px;
            font-size: 14px;
            color: #7f8c8d;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-weight: 600;
        }
        .tabs button.active { color: #2c3e50; border-bottom-color: #3498db; }
        .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
            padding: 24px;
        }
        .panel { display: none; }
        .panel.active { display: block; }
        /* 工具栏 */
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
        .toolbar input[type="text"], .toolbar select {
            height: 36px;
            padding: 0 10px;
            border: 1px solid #d5dbdb;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        .toolbar input[type="text"] { width: 240px; }
        .toolbar .btn {
            height: 36px;
            padding: 0 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-primary { background: #3498db; color: #fff; }
        .btn-primary:hover { background: #2980b9; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-ghost { background: #ecf0f1; color: #34495e; }
        .btn-ghost:hover { background: #d5dbdb; }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        .batch-bar { margin-bottom: 12px; font-size: 13px; color: #7f8c8d; }
        /* 表格 */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #ecf0f1; vertical-align: middle; }
        th { background: #f8f9fa; color: #7f8c8d; font-weight: 600; white-space: nowrap; }
        td .tag {
            display: inline-block;
            background: #eaf2f8;
            color: #2980b9;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            margin: 1px 2px 1px 0;
        }
        .btn-del {
            background: #fdecea;
            color: #c0392b;
            border: 1px solid #f5b7b1;
            border-radius: 5px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-del:hover { background: #f5b7b1; }
        .btn-edit {
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 6px;
        }
        .btn-edit:hover { background: #2980b9; }
        /* 手机端操作按钮垂直排列 */
        @media (max-width: 480px) {
            .btn-edit, .btn-del { display: block; width: 100%; margin: 2px 0; text-align: center; }
        }
        .empty-tip { text-align: center; color: #95a5a6; padding: 40px 0; font-size: 14px; }
        /* 分页 */
        .pager { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 14px; font-size: 13px; color: #7f8c8d; }
        .pager button {
            min-width: 30px;
            height: 30px;
            border: 1px solid #d5dbdb;
            background: #fff;
            border-radius: 5px;
            cursor: pointer;
        }
        .pager button:disabled { opacity: .4; cursor: not-allowed; }
        .pager .info { margin: 0 6px; }
        /* 表单 */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; color: #34495e; font-weight: 600; margin-bottom: 6px; }
        .form-group .req { color: #e74c3c; }
        .form-group input[type="text"], .form-group select, .form-group textarea {
            width: 100%;
            border: 1px solid #d5dbdb;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #3498db; }
        .form-group textarea { min-height: 260px; resize: vertical; line-height: 1.7; }
        .form-group .hint { font-size: 12px; color: #95a5a6; margin-top: 5px; }
        .char-count { font-size: 12px; color: #95a5a6; text-align: right; margin-top: 4px; }
        .char-count.over { color: #e74c3c; }
        .preview-toggle { float: right; font-size: 12px; color: #3498db; cursor: pointer; user-select: none; margin-top: -2px; }
        .preview-toggle:hover { text-decoration: underline; }
        .preview-box {
            display: none; border: 1px dashed #dfe4e8; border-radius: 6px; background: #fbfcfd;
            padding: 14px 16px; margin-top: 10px; max-height: 340px; overflow: auto;
            font-size: 14px; line-height: 1.7; color: #34495e;
        }
        .preview-box.show { display: block; }
        .preview-box table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        .preview-box th, .preview-box td { border: 1px solid #e3e8ee; padding: 6px 10px; text-align: left; }
        .preview-box th { background: #f2f5f9; font-weight: 600; }
        .preview-box pre { background: #f6f8fa; padding: 10px 12px; border-radius: 4px; overflow-x: auto; }
        .preview-box code { font-family: Consolas, monospace; font-size: 13px; }
        .preview-box img { max-width: 100%; border-radius: 4px; }
        .preview-box .md-fallback { white-space: pre-wrap; font-size: 13px; color: #7f8c8d; }
        .md-upload { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .md-upload input[type="file"] { font-size: 13px; color: #7f8c8d; }
        .btn-submit {
            background: #27ae60;
            color: #fff;
            border: none;
            height: 42px;
            padding: 0 32px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-submit:hover { background: #229954; }
        .btn-submit:disabled { background: #aeb6bf; cursor: not-allowed; }
        /* 表格横向滚动（小屏不破版） */
        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table-scroll table { min-width: 560px; }
        /* 评论管理 */
        .cm-content { max-width: 220px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        /* 手机端适配（≤ 768px） */
        @media (max-width: 768px) {
            .topbar { padding: 0 10px; height: 52px; }
            .topbar .brand { font-size: 14px; }
            .topbar .user-area { gap: 8px; }
            .topbar .btn-logout { padding: 5px 10px; font-size: 12px; }
            .tabs { padding: 0 6px; }
            .tabs button { padding: 12px 14px; font-size: 13px; }
            .container { padding: 0 8px; margin: 12px auto; }
            .card { padding: 14px; }
            .toolbar input[type="text"] { width: 100%; }
            .toolbar select { flex: 1; min-width: 0; }
            .toolbar .btn { padding: 0 12px; }
            .batch-bar { font-size: 12px; }
            /* 小屏隐藏次要列（ID/标签） */
            .hide-mobile { display: none; }
            .modal { padding: 20px 16px; }
            .pager { justify-content: center; }
            .form-group textarea { min-height: 200px; }
        }
        /* Toast */
        .toast-wrap { position: fixed; top: 70px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            background: #fff;
            border-left: 4px solid #27ae60;
            box-shadow: 0 4px 14px rgba(0,0,0,.15);
            border-radius: 6px;
            padding: 12px 18px;
            font-size: 14px;
            min-width: 220px;
            animation: slideIn .25s ease;
        }
        .toast.error { border-left-color: #e74c3c; }
        .toast.warn { border-left-color: #f39c12; }
        @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
        /* 确认弹窗 */
        .modal-mask {
            position: fixed; inset: 0; background: rgba(0,0,0,.45);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-mask.show { display: flex; }
        .modal {
            background: #fff; border-radius: 10px; width: 420px; max-width: 92vw;
            padding: 26px 24px; box-shadow: 0 12px 40px rgba(0,0,0,.3);
        }
        .modal h3 { font-size: 16px; color: #2c3e50; margin-bottom: 12px; }
        .modal p { font-size: 13px; color: #7f8c8d; margin-bottom: 8px; line-height: 1.7; }
        .modal .target-title {
            display: block; background: #f8f9fa; border-radius: 6px;
            padding: 10px 12px; color: #2c3e50; font-weight: 600; word-break: break-all;
            margin: 8px 0 16px; font-size: 14px;
        }
        .modal .btns { display: flex; justify-content: flex-end; gap: 10px; }
        .modal .btns button {
            height: 36px; padding: 0 20px; border: none; border-radius: 6px;
            cursor: pointer; font-size: 13px;
        }
        .modal .btn-cancel { background: #ecf0f1; color: #34495e; }
        .modal .btn-confirm-del { background: #e74c3c; color: #fff; }
        .modal .btn-confirm-del:hover { background: #c0392b; }
    </style>
    <!-- 内容预览：marked（本地打包，Markdown → HTML）+ DOMPurify（CDN；预览 HTML 白名单过滤，防上传 md / HTML 内容在管理员会话内执行脚本；不可用时预览降级为转义纯文本） -->
    <script src="../js/marked.js"></script>
    <script src="../js/heading-ids.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
    <div class="topbar">
        <div class="brand"><a href="/">个人主页 · 后台管理</a></div>
        <div class="user-area">
            <span id="userName">管理员</span>
            <a href="/" style="color:#bdc3c7;font-size:13px;">查看前台</a>
            <button id="changePwdBtn" class="btn-logout" style="background:#f39c12;">修改密码</button>
            <button id="logoutBtn" class="btn-logout">退出登录</button>
        </div>
    </div>

    <div class="tabs">
        <button data-tab="list" class="active">文章列表</button>
        <button data-tab="add">添加文章</button>
        <button data-tab="comments">评论管理</button>
    </div>

    <div class="container">
        <!-- 文章列表 -->
        <div id="panel-list" class="panel card active">
            <div class="toolbar">
                <input type="text" id="searchKeyword" placeholder="按标题检索…" maxlength="100">
                <select id="searchCategory">
                    <option value="">全部分类</option>
                    <option value="博客">博客</option>
                    <option value="学习笔记">学习笔记</option>
                    <option value="生活感悟">生活感悟</option>
                </select>
                <input type="text" id="searchTag" placeholder="按标签检索…" maxlength="20">
                <button class="btn btn-primary" id="searchBtn">检索</button>
                <button class="btn btn-ghost" id="resetBtn">重置</button>
                <div style="flex:1"></div>
                <button class="btn btn-danger" id="batchDelBtn" disabled>批量删除</button>
            </div>
            <div class="batch-bar">
                <label><input type="checkbox" id="checkAll"> 全选</label>
                <span id="selectedCount" style="margin-left:10px;">已选 0 篇</span>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th style="width:36px;"></th>
                            <th class="hide-mobile" style="width:60px;">ID</th>
                            <th>标题</th>
                            <th style="width:90px;">类别</th>
                            <th class="hide-mobile" style="width:180px;">标签</th>
                            <th class="hide-mobile" style="width:70px;">浏览次数</th>
                            <th style="width:150px;">发布时间</th>
                            <th style="width:90px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="listBody"></tbody>
                </table>
            </div>
            <div class="pager">
                <button id="prevPage">上一页</button>
                <span class="info" id="pageInfo"></span>
                <button id="nextPage">下一页</button>
            </div>
        </div>

        <!-- 添加文章 -->
        <div id="panel-add" class="panel card">
            <form id="articleForm">
                <input type="hidden" id="f-id" value="">
                <div class="form-group">
                    <label for="f-title">标题 <span class="req">*</span></label>
                    <input type="text" id="f-title" maxlength="100" placeholder="请输入文章标题（≤ 100 字符）">
                    <div class="char-count"><span id="titleCount">0</span>/100</div>
                </div>
                <div class="form-group">
                    <label for="f-category">类别 <span class="req">*</span></label>
                    <select id="f-category">
                        <option value="">请选择类别</option>
                        <option value="博客">博客</option>
                        <option value="学习笔记">学习笔记</option>
                        <option value="生活感悟">生活感悟</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="f-link">跳转链接（选填）</label>
                    <input type="text" id="f-link" maxlength="500" placeholder="如 introduce.html 或 https://example.com；留空则卡片进入文章页">
                    <div class="hint">仅允许站内相对路径或 http/https/mailto 链接；填写后首页卡片"阅读更多"直接跳转到该链接</div>
                </div>
                <div class="form-group">
                    <label for="f-format">内容格式 <span class="req">*</span></label>
                    <select id="f-format">
                        <option value="html">HTML 富文本（默认，支持 &lt;table&gt; 表格等标签）</option>
                        <option value="markdown">Markdown（支持 # 标题 / 列表 / 代码块 / 表格 | a | b | / 链接等语法；标题自动生成锚点，可作文内目录）</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="f-content">内容 <span class="req">*</span><span class="preview-toggle" id="previewToggle">预览</span></label>
                    <textarea id="f-content" placeholder="支持基本的 HTML 排版：段落、加粗、列表、链接、图片、表格（&lt;table&gt;&lt;tr&gt;&lt;th&gt;…）等（≤ 50,000 字符）"></textarea>
                    <div class="char-count"><span id="contentCount">0</span>/50000</div>
                    <div class="preview-box" id="f-preview"></div>
                </div>
                <div class="form-group">
                    <label>上传 .md 文件作文章（选填）</label>
                    <div class="md-upload">
                        <input type="file" id="f-mdfile" accept=".md,.markdown">
                        <span style="font-size:12px;color:#95a5a6;">选择后自动载入内容（文件名作标题、格式切为 Markdown），再点「发布文章」</span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="f-tags">标签（选填）</label>
                    <input type="text" id="f-tags" maxlength="150" placeholder="多个标签用逗号分隔，最多 5 个，每项 ≤ 20 字符">
                    <div class="hint">仅允许中文/英文/数字/下划线/连字符，自动去重</div>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">发布文章</button>
            </form>
        </div>

        <!-- 评论管理（REQ-32 / REQ-33） -->
        <div id="panel-comments" class="panel card">
            <div class="toolbar">
                <input type="text" id="cmSearchArticleId" placeholder="按文章 ID 检索…" maxlength="10">
                <button class="btn btn-primary" id="cmSearchBtn">检索</button>
                <button class="btn btn-ghost" id="cmResetBtn">重置</button>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th class="hide-mobile" style="width:60px;">ID</th>
                            <th>所属文章</th>
                            <th style="width:90px;">昵称</th>
                            <th class="hide-mobile" style="width:150px;">邮箱</th>
                            <th>评论内容</th>
                            <th class="hide-mobile" style="width:110px;">IP</th>
                            <th style="width:150px;">时间</th>
                            <th style="width:70px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="cmBody"></tbody>
                </table>
            </div>
            <div class="pager">
                <button id="cmPrevPage">上一页</button>
                <span class="info" id="cmPageInfo"></span>
                <button id="cmNextPage">下一页</button>
            </div>
        </div>
    </div>

    <!-- 删除二次确认弹窗 -->
    <div class="modal-mask" id="confirmModal">
        <div class="modal">
            <h3 id="modalTitle">确认删除</h3>
            <p id="modalDesc">确定要删除以下文章吗？删除后前台将立即下架，且不可恢复。</p>
            <span class="target-title" id="modalTarget"></span>
            <div class="btns">
                <button class="btn-cancel" id="modalCancel">取消</button>
                <button class="btn-confirm-del" id="modalConfirm">确认删除</button>
            </div>
        </div>
    </div>

    <!-- 修改密码弹窗 -->
    <div class="modal-mask" id="pwdModal">
        <div class="modal">
            <h3>修改密码</h3>
            <div class="form-group" style="margin-top:14px;">
                <label for="pwdOld">旧密码</label>
                <input type="password" id="pwdOld" placeholder="请输入当前密码" maxlength="64">
            </div>
            <div class="form-group">
                <label for="pwdNew">新密码</label>
                <input type="password" id="pwdNew" placeholder="6-64 个字符" maxlength="64">
            </div>
            <div class="form-group">
                <label for="pwdNew2">确认新密码</label>
                <input type="password" id="pwdNew2" placeholder="再次输入新密码" maxlength="64">
            </div>
            <div class="btns">
                <button class="btn-cancel" id="pwdCancel">取消</button>
                <button class="btn-confirm-del" id="pwdConfirm" style="background:#27ae60;">确认修改</button>
            </div>
        </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <script>
        (function () {
            'use strict';
            var csrfToken = '';
            var allArticles = [];     // 当前检索结果全集
            var page = 1;
            var pageSize = 10;
            var pendingDelete = null; // 文章: { mode:'article', ids, titles }；评论: { mode:'comment', id, display }
            var allComments = [];
            var cmPage = 1;
            var cmLoaded = false;
            var submitLocked = false;
            var editMode = false;     // true=编辑模式，false=添加模式
            var editingId = null;     // 正在编辑的文章 ID

            var $ = function (id) { return document.getElementById(id); };

            /* ---------- 工具 ---------- */
            function esc(s) {
                return String(s == null ? '' : s)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }
            function toast(msg, type) {
                var el = document.createElement('div');
                el.className = 'toast' + (type ? ' ' + type : '');
                el.textContent = msg;
                $('toastWrap').appendChild(el);
                setTimeout(function () { el.remove(); }, 3200);
            }
            function showError(msg) {
                toast(msg, 'error');
            }
            // 会话过期 / 无权限 → 跳转登录页
            function handleAuth(res) {
                if (res.status === 401) {
                    location.href = '/admin/login.html?next=' + encodeURIComponent('/admin/dashboard.html');
                    return true;
                }
                if (res.status === 403) {
                    showError('安全校验失败，请刷新页面重试');
                    return true;
                }
                return false;
            }
            function api(url, opts) {
                opts = opts || {};
                opts.headers = opts.headers || {};
                opts.headers['X-CSRF-Token'] = csrfToken;
                if (opts.body && typeof opts.body !== 'string') {
                    opts.headers['Content-Type'] = 'application/json';
                    opts.body = JSON.stringify(opts.body);
                }
                return fetch(url, opts).then(function (r) {
                    return r.json().then(function (d) {
                        if (handleAuth(r)) throw new Error('AUTH');
                        return { status: r.status, data: d };
                    });
                });
            }

            /* ---------- 初始化 ---------- */
            function init() {
                fetch('/api/auth/status')
                    .then(function (r) { return r.json(); })
                    .then(function (s) {
                        if (!s.loggedIn) {
                            location.href = '/admin/login.html?next=' + encodeURIComponent('/admin/dashboard.html');
                            return;
                        }
                        $('userName').textContent = s.username || '管理员';
                        return fetch('/api/csrf-token').then(function (r) { return r.json(); });
                    })
                    .then(function (d) {
                        if (d && d.csrfToken) csrfToken = d.csrfToken;
                        loadList();
                    })
                    .catch(function () {});
            }

            /* ---------- 文章列表（检索 / 分页） ---------- */
            function loadList() {
                var kw = encodeURIComponent($('searchKeyword').value.trim());
                var cat = encodeURIComponent($('searchCategory').value);
                var tag = encodeURIComponent($('searchTag').value.trim());
                var params = [];
                if (kw) params.push('keyword=' + kw);
                if (cat) params.push('category=' + cat);
                if (tag) params.push('tag=' + tag);
                var url = '/api/admin/articles' + (params.length ? '?' + params.join('&') : '');
                api(url)
                    .then(function (r) {
                        if (r.status !== 200) { showError(r.data.message || '加载失败'); return; }
                        allArticles = r.data.articles;
                        page = 1;
                        renderList();
                    })
                    .catch(function () {});
            }
            function renderList() {
                var body = $('listBody');
                var total = allArticles.length;
                var pages = Math.max(1, Math.ceil(total / pageSize));
                if (page > pages) page = pages;
                var start = (page - 1) * pageSize;
                var items = allArticles.slice(start, start + pageSize);
                if (!items.length) {
                    body.innerHTML = '<tr><td colspan="8"><div class="empty-tip">暂无文章，去「添加文章」发布第一篇吧</div></td></tr>';
                } else {
                    body.innerHTML = items.map(function (a) {
                        var tags = a.tags ? a.tags.split(',').map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') : '<span style="color:#bdc3c7">—</span>';
                        return '<tr>' +
                            '<td><input type="checkbox" class="row-check" value="' + a.id + '"></td>' +
                            '<td class="hide-mobile">' + a.id + '</td>' +
                            '<td><a href="/article?id=' + a.id + '" target="_blank" style="color:#2c3e50;text-decoration:none;">' + esc(a.title) + '</a></td>' +
                            '<td>' + esc(a.category) + '</td>' +
                            '<td class="hide-mobile">' + tags + '</td>' +
                            '<td class="hide-mobile" style="color:#7f8c8d;">' + (a.views != null ? a.views : 0) + '</td>' +
                            '<td style="color:#7f8c8d;">' + esc(a.created_at) + '</td>' +
                            '<td><button class="btn-edit" data-id="' + a.id + '" data-title="' + esc(a.title).replace(/"/g, '&quot;') + '" style="background:#3498db;color:#fff;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px;margin-right:6px;">编辑</button><button class="btn-del" data-id="' + a.id + '" data-title="' + esc(a.title).replace(/"/g, '&quot;') + '">删除</button></td>' +
                            '</tr>';
                    }).join('');
                }
                $('pageInfo').textContent = '共 ' + total + ' 篇 · 第 ' + page + '/' + pages + ' 页';
                $('prevPage').disabled = page <= 1;
                $('nextPage').disabled = page >= pages;
                $('checkAll').checked = false;
                updateSelectedCount();
            }

            function selectedIds() {
                var checks = document.querySelectorAll('.row-check:checked');
                var ids = [];
                checks.forEach(function (c) { ids.push(Number(c.value)); });
                return ids;
            }
            function updateSelectedCount() {
                var n = selectedIds().length;
                $('selectedCount').textContent = '已选 ' + n + ' 篇';
                $('batchDelBtn').disabled = n === 0;
            }

            /* ---------- 删除二次确认 ---------- */
            function openConfirm(ids, titles) {
                pendingDelete = { mode: 'article', ids: ids, titles: titles };
                $('modalTarget').textContent = titles.join('、');
                $('modalDesc').textContent = ids.length > 1
                    ? '确定要删除选中的 ' + ids.length + ' 篇文章吗？删除后前台将立即下架，且不可恢复。'
                    : '确定要删除以下文章吗？删除后前台将立即下架，且不可恢复。';
                $('confirmModal').classList.add('show');
            }
            function closeConfirm() {
                pendingDelete = null;
                $('confirmModal').classList.remove('show');
            }
            function doDelete(ids) {
                var url = ids.length === 1
                    ? '/api/admin/articles/' + ids[0]
                    : '/api/admin/articles/batch-delete';
                var opts = ids.length === 1
                    ? { method: 'DELETE' }
                    : { method: 'POST', body: { ids: ids } };
                api(url, opts)
                    .then(function (r) {
                        if (r.status === 200) {
                            toast(r.data.message || '删除成功');
                            loadList();
                        } else {
                            showError(r.data.message || '操作失败');
                        }
                    })
                    .catch(function () {});
            }

            /* ---------- 评论管理（REQ-32 / REQ-33 / BC-35） ---------- */
            function loadCommentsAdmin() {
                var aid = $('cmSearchArticleId').value.trim();
                var url = '/api/admin/comments' + (aid ? '?articleId=' + encodeURIComponent(aid) : '');
                api(url)
                    .then(function (r) {
                        if (r.status !== 200) { showError(r.data.message || '加载失败'); return; }
                        allComments = r.data.comments || [];
                        cmPage = 1;
                        renderCommentsAdmin();
                    })
                    .catch(function () {});
            }
            function renderCommentsAdmin() {
                var body = $('cmBody');
                var total = allComments.length;
                var pages = Math.max(1, Math.ceil(total / pageSize));
                if (cmPage > pages) cmPage = pages;
                var start = (cmPage - 1) * pageSize;
                var items = allComments.slice(start, start + pageSize);
                if (!items.length) {
                    body.innerHTML = '<tr><td colspan="8"><div class="empty-tip">暂无评论</div></td></tr>';
                } else {
                    body.innerHTML = items.map(function (c) {
                        var link = c.article_title
                            ? '<a href="/article?id=' + c.article_id + '" target="_blank" style="color:#2c3e50;text-decoration:none;">' + esc(c.article_title) + '</a>'
                            : '<span style="color:#bdc3c7">（文章已删除）</span>';
                        var display = '【' + c.nickname + '】' + (c.content.length > 40 ? c.content.slice(0, 40) + '…' : c.content);
                        return '<tr>' +
                            '<td class="hide-mobile">' + c.id + '</td>' +
                            '<td>' + link + '</td>' +
                            '<td>' + esc(c.nickname) + (c.parent_id ? ' <span style="color:#3498db;font-size:12px;">回复 @' + esc(c.parent_nickname || '?') + '</span>' : '') + '</td>' +
                            '<td class="hide-mobile">' + (c.email ? esc(c.email) : '<span style="color:#bdc3c7">—</span>') + '</td>' +
                            '<td><div class="cm-content" title="' + esc(c.content) + '">' + esc(c.content) + '</div></td>' +
                            '<td class="hide-mobile" style="color:#7f8c8d;">' + esc(c.ip) + '</td>' +
                            '<td style="color:#7f8c8d;">' + esc(c.created_at) + '</td>' +
                            '<td><button class="btn-del btn-cmdel" data-id="' + c.id + '" data-display="' + esc(display) + '" data-reply="' + (c.reply_count || 0) + '">删除</button></td>' +
                            '</tr>';
                    }).join('');
                }
                $('cmPageInfo').textContent = '共 ' + total + ' 条 · 第 ' + cmPage + '/' + pages + ' 页';
                $('cmPrevPage').disabled = cmPage <= 1;
                $('cmNextPage').disabled = cmPage >= pages;
            }
            function openCommentConfirm(id, display, replyCount) {
                pendingDelete = { mode: 'comment', id: id, display: display };
                $('modalDesc').textContent = (replyCount > 0)
                    ? '确定要删除以下评论吗？将连同其 ' + replyCount + ' 条回复一并删除，删除后前台立即不可见，且不可恢复。'
                    : '确定要删除以下评论吗？删除后前台将立即不可见，且不可恢复。';
                $('modalTarget').textContent = display;
                $('confirmModal').classList.add('show');
            }
            function doDeleteComment(id) {
                api('/api/admin/comments/' + id, { method: 'DELETE' })
                    .then(function (r) {
                        if (r.status === 200) {
                            toast(r.data.message || '删除成功');
                            loadCommentsAdmin();
                        } else if (r.status !== 401 && r.status !== 403) {
                            showError(r.data.message || '删除失败，请稍后重试');
                        }
                    })
                    .catch(function () {});
            }

            /* ---------- 编辑文章 ---------- */
            function loadArticleForEdit(id) {
                api('/api/articles/' + id)
                    .then(function (r) {
                        if (r.status !== 200) { showError(r.data.message || '加载失败'); return; }
                        var a = r.data.article;
                        $('f-id').value = a.id;
                        $('f-title').value = a.title;
                        $('f-category').value = a.category;
                        $('f-content').value = a.content;
                        $('f-tags').value = a.tags || '';
                        $('f-link').value = a.link || '';
                        $('f-format').value = a.format === 'markdown' ? 'markdown' : 'html';
                        updateContentPlaceholder();
                        editMode = true;
                        editingId = id;
                        $('submitBtn').textContent = '保存修改';
                        switchTab('add');
                        countChars();
                        toast('正在编辑：' + a.title, 'warn');
                    })
                    .catch(function () {});
            }
            function cancelEdit() {
                editMode = false;
                editingId = null;
                $('f-id').value = '';
                $('articleForm').reset();
                $('submitBtn').textContent = '发布文章';
                $('f-preview').classList.remove('show');
                updateContentPlaceholder();
                countChars();
            }
            function updateArticle() {
                if (submitLocked || !editingId) return;
                var title = $('f-title').value.trim();
                var category = $('f-category').value;
                var content = $('f-content').value;
                var tags = $('f-tags').value.trim();
                var link = $('f-link').value.trim();
                // 前端校验
                if (!title) { showError('标题不能为空'); return; }
                if (title.length > 100) { showError('标题不能超过 100 个字符'); return; }
                if (title.length < 10) { toast('提示：标题较短（建议 ≥ 10 字），不利于搜索引擎收录', 'warn'); }
                if (!category) { showError('请选择有效类别'); return; }
                if (!content.trim() && !content.replace(/<[^>]*>/g, '').trim()) { showError('内容不能为空'); return; }
                if (content.length > 50000) { showError('内容不能超过 50,000 个字符'); return; }
                submitLocked = true;
                var btn = $('submitBtn');
                btn.disabled = true;
                btn.textContent = '保存中...';
                api('/api/admin/articles/' + editingId, { method: 'PUT', body: { title: title, category: category, content: content, tags: tags, link: link, format: currentFormat() } })
                    .then(function (r) {
                        if (r.status === 200) {
                            toast(r.data.message || '更新成功');
                            cancelEdit();
                            loadList();
                        } else {
                            showError(r.data.message || '更新失败，请稍后重试');
                        }
                    })
                    .catch(function () {})
                    .finally(function () {
                        submitLocked = false;
                        btn.disabled = false;
                        btn.textContent = editMode ? '保存修改' : '发布文章';
                    });
            }

            /* ---------- 添加文章 ---------- */
            function countChars() {
                $('titleCount').textContent = $('f-title').value.length;
                var c = $('f-content').value.length;
                $('contentCount').textContent = c;
                $('contentCount').parentElement.classList.toggle('over', c > 50000);
            }
            /* ---------- 内容格式 / Markdown 预览 / .md 上传 ---------- */
            function currentFormat() {
                return $('f-format').value === 'markdown' ? 'markdown' : 'html';
            }
            function updateContentPlaceholder() {
                $('f-content').placeholder = currentFormat() === 'markdown'
                    ? 'Markdown 源码：# 标题（自动生成锚点，可用 [文字](#标题) 作文内目录跳转）、- 列表、| 表格 |、`代码`、[链接](url)、![图片](url)（≤ 50,000 字符）'
                    : '支持基本的 HTML 排版：段落、加粗、列表、链接、图片、表格（<table><tr><th>…）等（≤ 50,000 字符）';
            }
            // 预览渲染：markdown 用 marked 转 HTML；结果统一经 DOMPurify 白名单过滤再展示，
            // 防止上传的 md / 手写 HTML 在管理员会话内执行脚本；DOMPurify 不可用时降级为转义纯文本
            function previewContent() {
                var box = $('f-preview');
                var src = $('f-content').value;
                var html;
                if (currentFormat() === 'markdown') {
                    if (window.marked && typeof window.marked.parse === 'function') {
                        html = window.marked.parse(src);
                        // 标题锚点（目录跳转）：与文章页同规则生成 id，预览即所见
                        if (typeof addHeadingIds === 'function') html = addHeadingIds(html);
                    } else {
                        html = null;
                    }
                } else {
                    html = src;
                }
                if (!src.trim()) { box.classList.remove('show'); box.innerHTML = ''; return; }
                if (html != null && window.DOMPurify) {
                    box.innerHTML = window.DOMPurify.sanitize(html, {
                        ALLOWED_TAGS: ['p', 'br', 'strong', 'em', 'b', 'i', 'u', 'del', 's',
                            'ul', 'ol', 'li', 'a', 'img', 'span', 'div', 'hr',
                            'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'blockquote', 'code', 'pre',
                            'table', 'thead', 'tbody', 'tr', 'th', 'td', 'caption'],
                        // id：标题锚点（目录跳转）
                        ALLOWED_ATTR: ['href', 'title', 'target', 'rel', 'src', 'alt', 'colspan', 'rowspan', 'id'],
                    });
                } else {
                    box.innerHTML = '<div class="md-fallback">' + esc(html != null ? html : src) + '</div>';
                }
                box.classList.add('show');
            }
            function loadMdFile(file) {
                if (!file || !/\.(md|markdown)$/i.test(file.name)) { showError('请选择 .md / .markdown 文件'); return; }
                if (file.size > 50000) { showError('文件超过 50,000 字符上限'); return; }
                var reader = new FileReader();
                reader.onload = function () {
                    var text = String(reader.result || '');
                    if (!text.trim()) { showError('文件内容为空'); return; }
                    if (!$('f-title').value.trim()) $('f-title').value = file.name.replace(/\.(md|markdown)$/i, '');
                    $('f-format').value = 'markdown';
                    $('f-content').value = text;
                    updateContentPlaceholder();
                    countChars();
                    toast('已载入「' + file.name + '」，点击「发布文章」保存', 'ok');
                };
                reader.onerror = function () { showError('文件读取失败，请重试'); };
                reader.readAsText(file, 'utf-8');
            }
            function submitArticle() {
                if (submitLocked) return;
                var title = $('f-title').value.trim();
                var category = $('f-category').value;
                var content = $('f-content').value;
                var tags = $('f-tags').value.trim();
                var link = $('f-link').value.trim();
                // 前端校验（REQ-14 / BC-12 / BC-14 / BC-16）
                if (!title) { showError('标题不能为空'); return; }
                if (title.length > 100) { showError('标题不能超过 100 个字符'); return; }
                if (title.length < 10) { toast('提示：标题较短（建议 ≥ 10 字），不利于搜索引擎收录', 'warn'); }
                if (!category) { showError('请选择有效类别'); return; }
                if (!content.trim() && !content.replace(/<[^>]*>/g, '').trim()) { showError('内容不能为空'); return; }
                if (content.length > 50000) { showError('内容不能超过 50,000 个字符'); return; }
                submitLocked = true;
                var btn = $('submitBtn');
                btn.disabled = true;
                btn.textContent = '发布中...';
                api('/api/admin/articles', { method: 'POST', body: { title: title, category: category, content: content, tags: tags, link: link, format: currentFormat() } })
                    .then(function (r) {
                        if (r.status === 200) {
                            toast(r.data.message || '发布成功');
                            $('articleForm').reset();
                            countChars();
                            switchTab('list');
                            loadList();
                        } else {
                            showError(r.data.message || '发布失败，请稍后重试');
                        }
                    })
                    .catch(function () {})
                    .finally(function () {
                        submitLocked = false;
                        btn.disabled = false;
                        btn.textContent = '发布文章';
                    });
            }

            /* ---------- Tab 切换 ---------- */
            function switchTab(name) {
                document.querySelectorAll('.tabs button').forEach(function (b) {
                    b.classList.toggle('active', b.getAttribute('data-tab') === name);
                });
                $('panel-list').classList.toggle('active', name === 'list');
                $('panel-add').classList.toggle('active', name === 'add');
                $('panel-comments').classList.toggle('active', name === 'comments');
                if (name === 'add') countChars();
                if (name === 'list' && editMode) cancelEdit();
                if (name === 'comments' && !cmLoaded) { cmLoaded = true; loadCommentsAdmin(); }
            }

            /* ---------- 事件绑定 ---------- */
            document.querySelectorAll('.tabs button').forEach(function (b) {
                b.addEventListener('click', function () { switchTab(b.getAttribute('data-tab')); });
            });
            $('searchBtn').addEventListener('click', loadList);
            $('resetBtn').addEventListener('click', function () {
                $('searchKeyword').value = '';
                $('searchCategory').value = '';
                $('searchTag').value = '';
                loadList();
            });
            $('searchKeyword').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadList(); });
            $('searchTag').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadList(); });
            $('prevPage').addEventListener('click', function () { if (page > 1) { page--; renderList(); } });
            $('nextPage').addEventListener('click', function () { if (page * pageSize < allArticles.length) { page++; renderList(); } });
            $('checkAll').addEventListener('change', function () {
                document.querySelectorAll('.row-check').forEach(function (c) { c.checked = $('checkAll').checked; });
                updateSelectedCount();
            });
            $('listBody').addEventListener('change', function (e) {
                if (e.target.classList.contains('row-check')) updateSelectedCount();
            });
            $('listBody').addEventListener('click', function (e) {
                var delBtn = e.target.closest('.btn-del');
                var editBtn = e.target.closest('.btn-edit');
                if (delBtn) {
                    var id = Number(delBtn.getAttribute('data-id'));
                    var title = delBtn.getAttribute('data-title');
                    openConfirm([id], [title]);
                }
                if (editBtn) {
                    var id = Number(editBtn.getAttribute('data-id'));
                    loadArticleForEdit(id);
                }
            });
            /* ---------- 评论管理事件 ---------- */
            $('cmSearchBtn').addEventListener('click', loadCommentsAdmin);
            $('cmSearchArticleId').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadCommentsAdmin(); });
            $('cmResetBtn').addEventListener('click', function () {
                $('cmSearchArticleId').value = '';
                loadCommentsAdmin();
            });
            $('cmPrevPage').addEventListener('click', function () { if (cmPage > 1) { cmPage--; renderCommentsAdmin(); } });
            $('cmNextPage').addEventListener('click', function () { if (cmPage * pageSize < allComments.length) { cmPage++; renderCommentsAdmin(); } });
            $('cmBody').addEventListener('click', function (e) {
                var btn = e.target.closest('.btn-cmdel');
                if (!btn) return;
                var id = Number(btn.getAttribute('data-id'));
                var display = btn.getAttribute('data-display');
                openCommentConfirm(id, display, Number(btn.getAttribute('data-reply')) || 0);
            });
            $('batchDelBtn').addEventListener('click', function () {
                var ids = selectedIds();
                if (!ids.length) return;
                var titles = [];
                allArticles.forEach(function (a) {
                    if (ids.indexOf(a.id) !== -1) titles.push(a.title);
                });
                openConfirm(ids, titles);
            });
            $('modalCancel').addEventListener('click', closeConfirm);
            $('confirmModal').addEventListener('click', function (e) {
                if (e.target === $('confirmModal')) closeConfirm();
            });
            $('modalConfirm').addEventListener('click', function () {
                if (!pendingDelete) return;
                if (pendingDelete.mode === 'comment') {
                    var cid = pendingDelete.id;
                    closeConfirm();
                    doDeleteComment(cid);
                    return;
                }
                var ids = pendingDelete.ids.slice();
                closeConfirm();
                doDelete(ids);
            });
            $('logoutBtn').addEventListener('click', function () {
                fetch('/api/logout', { method: 'POST' }).finally(function () {
                    location.href = '/admin/login.html';
                });
            });

            /* ---------- 修改密码 ---------- */
            function openPwdModal() {
                $('pwdOld').value = '';
                $('pwdNew').value = '';
                $('pwdNew2').value = '';
                $('pwdModal').classList.add('show');
                $('pwdOld').focus();
            }
            function closePwdModal() {
                $('pwdModal').classList.remove('show');
            }
            $('changePwdBtn').addEventListener('click', openPwdModal);
            $('pwdCancel').addEventListener('click', closePwdModal);
            $('pwdModal').addEventListener('click', function (e) {
                if (e.target === $('pwdModal')) closePwdModal();
            });
            $('pwdConfirm').addEventListener('click', function () {
                var oldPwd = $('pwdOld').value;
                var newPwd = $('pwdNew').value;
                var newPwd2 = $('pwdNew2').value;
                if (!oldPwd || !newPwd) { showError('请填写旧密码和新密码'); return; }
                if (newPwd.length < 6 || newPwd.length > 64) { showError('新密码长度需为 6-64 个字符'); return; }
                if (newPwd !== newPwd2) { showError('两次输入的新密码不一致'); return; }
                var btn = $('pwdConfirm');
                btn.disabled = true;
                api('/api/admin/change-password', { method: 'POST', body: { oldPassword: oldPwd, newPassword: newPwd } })
                    .then(function (r) {
                        if (r.status === 200) {
                            toast(r.data.message || '密码修改成功');
                            closePwdModal();
                        } else {
                            showError(r.data.message || '修改失败，请重试');
                        }
                    })
                    .catch(function () {})
                    .finally(function () { btn.disabled = false; });
            });
            // 回车提交
            ['pwdOld', 'pwdNew', 'pwdNew2'].forEach(function (id) {
                $(id).addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') $('pwdConfirm').click();
                });
            });
            $('articleForm').addEventListener('submit', function (e) {
                e.preventDefault();
                if (editMode) {
                    updateArticle();
                } else {
                    submitArticle();
                }
            });
            $('f-title').addEventListener('input', countChars);
            $('f-content').addEventListener('input', countChars);
            $('f-format').addEventListener('change', updateContentPlaceholder);
            $('previewToggle').addEventListener('click', previewContent);
            $('f-mdfile').addEventListener('change', function () { loadMdFile(this.files[0]); this.value = ''; });

            init();
        })();
    </script>
</body>
</html>
