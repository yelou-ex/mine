<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 个人主页后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', 'Microsoft YaHei', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
        }
        .login-card {
            width: 380px;
            max-width: 92vw;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            padding: 40px 36px;
        }
        .login-card h1 {
            font-size: 22px;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 8px;
        }
        .login-card .sub {
            text-align: center;
            color: #7f8c8d;
            font-size: 13px;
            margin-bottom: 28px;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #34495e;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #d5dbdb;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color .2s;
        }
        .form-group input:focus { border-color: #3498db; }
        .error-msg {
            display: none;
            background: #fdecea;
            color: #c0392b;
            border: 1px solid #f5b7b1;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .error-msg.show { display: block; }
        .btn-login {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 6px;
            background: #3498db;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color .2s;
        }
        .btn-login:hover { background: #2980b9; }
        .btn-login:disabled { background: #aeb6bf; cursor: not-allowed; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #7f8c8d;
            text-decoration: none;
        }
        .back-link:hover { color: #3498db; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>管理员登录</h1>
        <p class="sub">个人主页网站后台管理系统</p>
        <div id="errorMsg" class="error-msg"></div>
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" maxlength="50">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" maxlength="100">
            </div>
            <button type="submit" id="loginBtn" class="btn-login">登 录</button>
        </form>
        <a class="back-link" href="/">← 返回网站首页</a>
    </div>

    <script>
        // 登录页：防空白提交 / 统一错误提示 / 账户锁定提示 / 回车提交 / 登录后回跳原页面
        (function () {
            var form = document.getElementById('loginForm');
            var username = document.getElementById('username');
            var password = document.getElementById('password');
            var btn = document.getElementById('loginBtn');
            var errorMsg = document.getElementById('errorMsg');

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.classList.add('show');
            }
            function clearError() {
                errorMsg.classList.remove('show');
            }

            function getNext() {
                var m = location.search.match(/[?&]next=([^&]+)/);
                if (!m) return '/admin/dashboard.html';
                try {
                    var n = decodeURIComponent(m[1]);
                    return n.indexOf('/admin/') === 0 ? n : '/admin/dashboard.html';
                } catch (e) {
                    return '/admin/dashboard.html';
                }
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                clearError();
                // 前端防空白提交（REQ-02）：trim 后非空才允许提交
                if (!username.value.trim() || !password.value.trim()) {
                    showError('请输入用户名和密码');
                    return;
                }
                btn.disabled = true;
                btn.textContent = '登录中...';
                fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username.value.trim(), password: password.value })
                })
                    .then(function (res) {
                        return res.json().then(function (data) {
                            return { status: res.status, data: data };
                        });
                    })
                    .then(function (r) {
                        if (r.status === 200 && r.data.success) {
                            location.href = getNext();
                            return;
                        }
                        // 后端统一错误提示（含锁定 423 与防空白 400）
                        showError(r.data.message || '登录失败，请稍后重试');
                        password.value = '';
                        btn.disabled = false;
                        btn.textContent = '登 录';
                    })
                    .catch(function () {
                        showError('系统繁忙，请稍后重试');
                        btn.disabled = false;
                        btn.textContent = '登 录';
                    });
            });

            // 已登录则直接进入后台
            fetch('/api/auth/status')
                .then(function (r) { return r.json(); })
                .then(function (s) {
                    if (s.loggedIn) location.href = getNext();
                })
                .catch(function () {});
        })();
    </script>
</body>
</html>
