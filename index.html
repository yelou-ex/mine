<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yelou的个人博客</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-image: url("picture/d3SJaPgZhqMVOQv.thumb.png");
            background-size: cover;
			background-attachment: fixed;
			background-repeat: no-repeat;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 内容不足一屏时让页脚始终贴底 */
        .main-wrap { flex: 1 1 auto; width: 100%; }
        
        a {
            text-decoration: none;
            color: #3498db;
        }
        
        a:hover {
            color: #2980b9;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* 头部样式 */
        header {
            background-color: #fff;
			opacity: 0.8;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px 0;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }
        
        nav ul {
            display: flex;
            list-style: none;
        }
        
        nav ul li {
            margin-left: 20px;
        }
        
        nav ul li a {
            color: #2c3e50;
            font-weight: 500;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        nav ul li a:hover {
            background-color: #ecf0f1;
        }
        
        /* 主要内容区域 */
        .main-content {
            display: flex;
            margin: 30px 0;
        }
        
        /* 博客文章区域 */
        .blog-posts {
            flex: 2;
            margin-right: 30px;opacity: 0.9;
        }
        
        .post {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .post-title {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .post-meta {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .post-content {
            margin-bottom: 15px;
        }
        
        .read-more {
            display: inline-block;
            background-color: #3498db;
            color: #fff;
            padding: 8px 15px;
            border-radius: 4px;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        
        .read-more:hover {
            background-color: #2980b9;
            color: #fff;
        }
        
        /* 侧边栏 */
        .sidebar {
            flex: 1;opacity: 0.8;
        }
        
        .sidebar-widget {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .widget-title {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ecf0f1;
        }
        
        .about-me {
            text-align: center;
        }
        
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: block;
            object-fit: cover;
        }
        
        .categories ul {
            list-style: none;
        }
        
        .categories ul li {
            margin-bottom: 10px;
        }
        
        .categories ul li a {
            display: block;
            padding: 5px 10px;
            background-color: #ecf0f1;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        .categories ul li a:hover {
            background-color: #d5dbdb;
        }
        
        .categories ul li a.active {
            background-color: #3498db;
            color: #fff;
        }
        
        .recent-posts li {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ecf0f1;
            list-style: none;
        }
        
        .recent-posts li:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .recent-posts li a {
            color: #2c3e50;
        }
        
        .recent-posts li a:hover {
            color: #3498db;
        }
        
        /* 标签 */
        .post-tags .tag {
            display: inline-block;
            background-color: #eaf2f8;
            color: #2980b9;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            margin: 0 4px 4px 0;
        }
        
        /* 加载提示与空状态 */
        .post-tip {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 40px 20px;
            text-align: center;
            color: #7f8c8d;
        }
        
        /* 页脚 */
        footer {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 30px 0;
            text-align: center;
        }
        
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .footer-links a {
            color: #ecf0f1;
            margin: 0 10px;
        }
        
        .footer-links a:hover {
            text-decoration: underline;
        }
        
        .copyright {
            border-top: 1px solid #34495e;
            padding-top: 20px;
            font-size: 14px;
        }
        
        /* 搜索框样式 */
        .search-bar {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 16px 20px;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            gap: 10px;
        }
        .search-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-input:focus {
            border-color: #3498db;
        }
        .search-btn {
            padding: 10px 20px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        .search-btn:hover {
            background-color: #2980b9;
        }
        .clear-btn {
            padding: 10px 16px;
            background-color: #95a5a6;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        .clear-btn:hover {
            background-color: #7f8c8d;
        }
        .active-filters {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background-color: #eaf2f8;
            color: #2980b9;
            border-radius: 4px;
            font-size: 13px;
        }
        .filter-tag .remove {
            cursor: pointer;
            font-weight: bold;
            opacity: 0.7;
        }
        .filter-tag .remove:hover {
            opacity: 1;
        }

        /* 标签云样式 */
        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag-item {
            display: inline-block;
            padding: 4px 12px;
            background-color: #eaf2f8;
            color: #2980b9;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        .tag-item:hover {
            background-color: #d5dbdb;
            border-color: #3498db;
        }
        .tag-item.active {
            background-color: #3498db;
            color: #fff;
        }
        .tag-count {
            font-size: 11px;
            opacity: 0.8;
            margin-left: 2px;
        }

        /* 手机端适配（≤ 768px） */
        @media (max-width: 768px) {
            .header-content { flex-direction: column; gap: 12px; }
            .logo { font-size: 20px; }
            nav ul li { margin-left: 12px; }
            .main-content { flex-direction: column; margin: 20px 0; }
            .blog-posts { margin-right: 0; }
            .post { padding: 16px; }
            .post-title { font-size: 18px; }
            .sidebar { margin-top: 8px; }
            .footer-content { flex-direction: column; gap: 10px; }
            .search-box { flex-direction: column; }
            .search-btn, .clear-btn { width: 100%; }

            /* 手机端隐藏头像和最近文章 */
            .about-me { display: none; }
            .recent-posts { display: none; }

            /* 手机端分类和标签云移至搜索框上方 */
            .mobile-filter-bar { display: flex !important; }
        }

        /* 手机端的分类和标签筛选栏（默认隐藏） */
        .mobile-filter-bar {
            display: none;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 12px 16px;
            margin-bottom: 12px;
        }
        .mobile-filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .mobile-filter-label {
            font-size: 14px;
            color: #7f8c8d;
            margin-right: 8px;
        }
        .mobile-cat-btn {
            padding: 6px 14px;
            background-color: #ecf0f1;
            color: #2c3e50;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        .mobile-cat-btn:hover, .mobile-cat-btn.active {
            background-color: #3498db;
            color: #fff;
        }
        .mobile-tag-btn {
            padding: 4px 12px;
            background-color: #eaf2f8;
            color: #2980b9;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        .mobile-tag-btn:hover, .mobile-tag-btn.active {
            background-color: #3498db;
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">Yelou个人博客</div>
                <nav>
                    <ul>
                        <li><a href="index.html">首页</a></li>
                        <li><a href="introduce.html">关于我</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    
    <div class="container main-wrap">
        <!-- 手机端筛选栏 -->
        <div class="mobile-filter-bar">
            <div class="mobile-filter-row">
                <span class="mobile-filter-label">分类：</span>
                <button class="mobile-cat-btn active" data-cat="">全部</button>
                <button class="mobile-cat-btn" data-cat="博客">博客</button>
                <button class="mobile-cat-btn" data-cat="学习笔记">学习笔记</button>
                <button class="mobile-cat-btn" data-cat="生活感悟">生活感悟</button>
            </div>
            <div class="mobile-filter-row" style="margin-top: 8px;">
                <span class="mobile-filter-label">标签：</span>
                <div id="mobileTagCloud" class="tag-cloud" style="flex-wrap: wrap;">
                    <span style="color:#7f8c8d;font-size:13px;">加载中...</span>
                </div>
            </div>
        </div>

        <div class="search-bar">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="搜索文章标题...">
                <button id="searchBtn" class="search-btn">搜索</button>
                <button id="clearBtn" class="clear-btn" style="display:none;">清除</button>
            </div>
            <div id="activeFilters" class="active-filters"></div>
        </div>
        <div class="main-content">
            <div class="blog-posts">
                <div id="posts">
                    <div class="post-tip">文章加载中…</div>
                </div>
            </div>
            
            <aside class="sidebar">
                <div class="sidebar-widget about-me">
                    <img src="picture/Image_1751250027684.jpg" alt="个人头像" class="profile-img">
                    <h3 class="widget-title">杨楼&nbsp;</h3>
                    <p>你好！我是一名热爱技术、运动和游戏的博客作者。通过这个博客，我希望能够分享我的所学所思，记录生活中的美好瞬间。</p>
                </div>
                
                <div class="sidebar-widget categories">
                    <h3 class="widget-title">分类</h3>
                    <ul id="categoryList">
                        <li><a href="index.html" data-cat="">全部</a></li>
                        <li><a href="index.html?category=博客" data-cat="博客">博客</a></li>
                        <li><a href="index.html?category=学习笔记" data-cat="学习笔记">学习笔记</a></li>
                        <li><a href="index.html?category=生活感悟" data-cat="生活感悟">生活感悟</a></li>
                    </ul>
                </div>
                
                <div class="sidebar-widget">
                    <h3 class="widget-title">标签云</h3>
                    <div id="tagCloud" class="tag-cloud">
                        <span class="tag-item">加载中…</span>
                    </div>
                </div>

                <div class="sidebar-widget recent-posts">
                    <h3 class="widget-title">最近文章</h3>
                    <ul id="recentList">
                        <li><a href="#">加载中…</a></li>
                    </ul>
                </div>
            </aside>
        </div>
    </div>
    
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <p>© 2025 yelou的个人博客. 保留所有权利.</p>
                </div>
                <div class="footer-links">
                    <a href="index.html">首页</a>
                </div>
            </div>
            <div class="copyright">
                <p>本网站由热爱分享的我创建和维护</p>
            </div>
        </div>
    </footer>

    <script>
        // 前台文章动态渲染：从后端 API 加载（内容由后台发布入库）
        (function () {
            function esc(s) {
                return String(s == null ? '' : s)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }
            function getQueryParam(name) {
                var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
                if (!m) return '';
                try { return decodeURIComponent(m[1]); } catch (e) { return ''; }
            }

            // 读取 URL 参数
            var category = getQueryParam('category');
            var keyword = getQueryParam('keyword');
            var tag = getQueryParam('tag');

            // 初始化搜索框显示
            var searchInput = document.getElementById('searchInput');
            if (keyword) searchInput.value = keyword;

            // 标记当前激活分类
            document.querySelectorAll('#categoryList a').forEach(function (a) {
                if ((a.getAttribute('data-cat') || '') === category) a.classList.add('active');
            });

            function fmtDate(s) {
                return String(s || '').replace('T', ' ').slice(0, 16);
            }

            // 渲染文章列表
            function renderArticles(articles) {
                var box = document.getElementById('posts');
                if (!articles.length) {
                    var tip = '暂无文章';
                    if (category) tip += '（当前分类：' + esc(category) + '）';
                    if (tag) tip += '（当前标签：' + esc(tag) + '）';
                    if (keyword) tip += '（关键词：' + esc(keyword) + '）';
                    tip += '，敬请期待';
                    box.innerHTML = '<div class="post-tip">' + tip + '</div>';
                    return;
                }
                box.innerHTML = articles.map(function (a) {
                    // 有 link 的文章（如三个原有静态页面）点击进入静态页面，否则进入文章详情页
                    var href = a.link ? a.link : 'article.html?id=' + a.id;
                    var tags = (a.tags || '').split(',').filter(Boolean)
                        .map(function (t) { return '<span class="tag" data-tag="' + esc(t) + '">' + esc(t) + '</span>'; })
                        .join('');
                    return '<article class="post">' +
                        '<h2 class="post-title"><a href="' + href + '">' + esc(a.title) + '</a></h2>' +
                        '<div class="post-meta">' +
                        '<span>发布于: ' + fmtDate(a.created_at) + '</span> | ' +
                        '<span>分类: <a href="index.html?category=' + encodeURIComponent(a.category) + '">' + esc(a.category) + '</a></span>' +
                        (tags ? ' | <span class="post-tags">' + tags + '</span>' : '') +
                        '</div>' +
                        (a.summary ? '<div class="post-content">' + esc(a.summary) + '</div>' : '') +
                        '<a href="' + href + '" class="read-more">阅读更多</a>' +
                        '</article>';
                }).join('');
            }

            // 渲染最近文章
            function renderRecent(articles) {
                var ul = document.getElementById('recentList');
                if (!articles.length) {
                    ul.innerHTML = '<li><a href="#">敬请期待</a></li>';
                    return;
                }
                ul.innerHTML = articles.slice(0, 5).map(function (a) {
                    var href = a.link ? a.link : 'article.html?id=' + a.id;
                    return '<li><a href="' + href + '">' + esc(a.title) + '</a></li>';
                }).join('');
            }

            // 渲染标签云
            function renderTagCloud(tags) {
                var container = document.getElementById('tagCloud');
                if (!tags || !tags.length) {
                    container.innerHTML = '<span style="color:#7f8c8d;font-size:13px;">暂无标签</span>';
                    return;
                }
                container.innerHTML = tags.map(function (t) {
                    var isActive = t.name === tag ? ' active' : '';
                    return '<span class="tag-item' + isActive + '" data-tag="' + esc(t.name) + '">' +
                        esc(t.name) +
                        '<span class="tag-count">(' + t.count + ')</span>' +
                        '</span>';
                }).join('');
            }

            // 更新 URL 参数（不刷新页面）
            function updateUrl() {
                var params = [];
                if (category) params.push('category=' + encodeURIComponent(category));
                if (keyword) params.push('keyword=' + encodeURIComponent(keyword));
                if (tag) params.push('tag=' + encodeURIComponent(tag));
                var newUrl = 'index.html' + (params.length ? '?' + params.join('&') : '');
                history.replaceState(null, '', newUrl);

                // 更新搜索框显示
                if (keyword) {
                    searchInput.value = keyword;
                    document.getElementById('clearBtn').style.display = '';
                } else {
                    searchInput.value = '';
                    document.getElementById('clearBtn').style.display = 'none';
                }

                // 更新激活筛选标签显示
                var filtersHtml = '';
                if (category) filtersHtml += '<span class="filter-tag">分类: ' + esc(category) + ' <span class="remove" data-filter="category">×</span></span>';
                if (tag) filtersHtml += '<span class="filter-tag">标签: ' + esc(tag) + ' <span class="remove" data-filter="tag">×</span></span>';
                if (keyword) filtersHtml += '<span class="filter-tag">搜索: ' + esc(keyword) + ' <span class="remove" data-filter="keyword">×</span></span>';
                document.getElementById('activeFilters').innerHTML = filtersHtml;
            }

            // 加载文章
            function loadArticles() {
                var params = [];
                if (category) params.push('category=' + encodeURIComponent(category));
                if (keyword) params.push('keyword=' + encodeURIComponent(keyword));
                if (tag) params.push('tag=' + encodeURIComponent(tag));
                var url = '/api/articles' + (params.length ? '?' + params.join('&') : '');

                fetch(url)
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        renderArticles(d.articles || []);
                        // 最近文章取全量最新 5 篇
                        return fetch('/api/articles').then(function (r) { return r.json(); });
                    })
                    .then(function (d) { renderRecent(d.articles || []); })
                    .catch(function () {
                        document.getElementById('posts').innerHTML =
                            '<div class="post-tip">文章加载失败，请稍后刷新重试</div>';
                    });
            }

            // 加载标签云
            function loadTagCloud() {
                fetch('/api/articles/tags')
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        renderTagCloud(d.tags || []);
                        renderMobileTagCloud(d.tags || []);
                    })
                    .catch(function () {
                        document.getElementById('tagCloud').innerHTML =
                            '<span style="color:#7f8c8d;font-size:13px;">标签加载失败</span>';
                        document.getElementById('mobileTagCloud').innerHTML =
                            '<span style="color:#7f8c8d;font-size:13px;">标签加载失败</span>';
                    });
            }

            // 渲染移动端标签云
            function renderMobileTagCloud(tags) {
                var container = document.getElementById('mobileTagCloud');
                if (!tags || !tags.length) {
                    container.innerHTML = '<span style="color:#7f8c8d;font-size:13px;">暂无标签</span>';
                    return;
                }
                container.innerHTML = tags.map(function (t) {
                    var isActive = t.name === tag ? ' active' : '';
                    return '<button class="mobile-tag-btn' + isActive + '" data-tag="' + esc(t.name) + '">' +
                        esc(t.name) + '</button>';
                }).join('');
            }

            // 绑定事件
            document.getElementById('searchBtn').addEventListener('click', function () {
                keyword = searchInput.value.trim();
                updateUrl();
                loadArticles();
            });

            searchInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    keyword = searchInput.value.trim();
                    updateUrl();
                    loadArticles();
                }
            });

            document.getElementById('clearBtn').addEventListener('click', function () {
                keyword = '';
                searchInput.value = '';
                updateUrl();
                loadArticles();
            });

            // 桌面端分类点击
            document.querySelectorAll('#categoryList a').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    category = a.getAttribute('data-cat') || '';
                    updateUrl();
                    loadArticles();
                });
            });

            // 桌面端标签云点击
            document.getElementById('tagCloud').addEventListener('click', function (e) {
                var item = e.target.closest('.tag-item');
                if (!item) return;
                tag = item.getAttribute('data-tag');
                updateUrl();
                loadArticles();
            });

            // 移动端分类按钮点击
            document.querySelectorAll('.mobile-cat-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    category = this.getAttribute('data-cat') || '';
                    // 更新激活状态
                    document.querySelectorAll('.mobile-cat-btn').forEach(function (b) {
                        b.classList.remove('active');
                    });
                    this.classList.add('active');
                    updateUrl();
                    loadArticles();
                });
            });

            // 移动端标签按钮点击
            document.getElementById('mobileTagCloud').addEventListener('click', function (e) {
                var btn = e.target.closest('.mobile-tag-btn');
                if (!btn) return;
                tag = btn.getAttribute('data-tag');
                // 更新激活状态
                document.querySelectorAll('.mobile-tag-btn').forEach(function (b) {
                    b.classList.remove('active');
                });
                btn.classList.add('active');
                updateUrl();
                loadArticles();
            });

            // 清除筛选
            document.getElementById('activeFilters').addEventListener('click', function (e) {
                var remove = e.target.closest('.remove');
                if (!remove) return;
                var filterType = remove.getAttribute('data-filter');
                if (filterType === 'category') category = '';
                else if (filterType === 'tag') tag = '';
                else if (filterType === 'keyword') {
                    keyword = '';
                    searchInput.value = '';
                    document.getElementById('clearBtn').style.display = 'none';
                }
                updateUrl();
                loadArticles();
            });

            // 初始化
            updateUrl();
            loadArticles();
            loadTagCloud();
        })();
    </script>
</body>
</html>
