<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yelou的个人博客</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-image: url("picture/d3SJaPgZhqMVOQv.thumb.png");
            background-size: cover;
			background-attachment: fixed;
			background-repeat: no-repeat;
            line-height: 1.6;
        }
        
        a {
            text-decoration: none;
            color: #3498db;
        }
        
        a:hover {
            color: #2980b9;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* 头部样式 */
        header {
            background-color: #fff;
			opacity: 0.8;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px 0;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }
        
        nav ul {
            display: flex;
            list-style: none;
        }
        
        nav ul li {
            margin-left: 20px;
        }
        
        nav ul li a {
            color: #2c3e50;
            font-weight: 500;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        nav ul li a:hover {
            background-color: #ecf0f1;
        }
        
        /* 主要内容区域 */
        .main-content {
            display: flex;
            margin: 30px 0;
        }
        
        /* 博客文章区域 */
        .blog-posts {
            flex: 2;
            margin-right: 30px;opacity: 0.9;
        }
        
        .post {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .post-title {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .post-meta {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .post-content {
            margin-bottom: 15px;
        }
        
        .read-more {
            display: inline-block;
            background-color: #3498db;
            color: #fff;
            padding: 8px 15px;
            border-radius: 4px;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        
        .read-more:hover {
            background-color: #2980b9;
            color: #fff;
        }
        
        /* 侧边栏 */
        .sidebar {
            flex: 1;opacity: 0.8;
        }
        
        .sidebar-widget {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .widget-title {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ecf0f1;
        }
        
        .about-me {
            text-align: center;
        }
        
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: block;
            object-fit: cover;
        }
        
        .categories ul {
            list-style: none;
        }
        
        .categories ul li {
            margin-bottom: 10px;
        }
        
        .categories ul li a {
            display: block;
            padding: 5px 10px;
            background-color: #ecf0f1;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        .categories ul li a:hover {
            background-color: #d5dbdb;
        }
        
        .categories ul li a.active {
            background-color: #3498db;
            color: #fff;
        }
        
        .recent-posts li {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ecf0f1;
            list-style: none;
        }
        
        .recent-posts li:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .recent-posts li a {
            color: #2c3e50;
        }
        
        .recent-posts li a:hover {
            color: #3498db;
        }
        
        /* 标签 */
        .post-tags .tag {
            display: inline-block;
            background-color: #eaf2f8;
            color: #2980b9;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            margin: 0 4px 4px 0;
        }
        
        /* 加载提示与空状态 */
        .post-tip {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 40px 20px;
            text-align: center;
            color: #7f8c8d;
        }
        
        /* 页脚 */
        footer {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 30px 0;
            text-align: center;
        }
        
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .footer-links a {
            color: #ecf0f1;
            margin: 0 10px;
        }
        
        .footer-links a:hover {
            text-decoration: underline;
        }
        
        .copyright {
            border-top: 1px solid #34495e;
            padding-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">Yelou个人博客</div>
                <nav>
                    <ul>
                        <li><a href="index.html">首页</a></li>
                        <li><a href="introduce.html">关于我</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    
    <div class="container">
        <div class="main-content">
            <div class="blog-posts">
                <div id="posts">
                    <div class="post-tip">文章加载中…</div>
                </div>
            </div>
            
            <aside class="sidebar">
                <div class="sidebar-widget about-me">
                    <img src="picture/Image_1751250027684.jpg" alt="个人头像" class="profile-img">
                    <h3 class="widget-title">杨楼&nbsp;</h3>
                    <p>你好！我是一名热爱技术、运动和游戏的博客作者。通过这个博客，我希望能够分享我的所学所思，记录生活中的美好瞬间。</p>
                </div>
                
                <div class="sidebar-widget categories">
                    <h3 class="widget-title">分类</h3>
                    <ul id="categoryList">
                        <li><a href="index.html" data-cat="">全部</a></li>
                        <li><a href="index.html?category=博客" data-cat="博客">博客</a></li>
                        <li><a href="index.html?category=学习笔记" data-cat="学习笔记">学习笔记</a></li>
                        <li><a href="index.html?category=生活感悟" data-cat="生活感悟">生活感悟</a></li>
                    </ul>
                </div>
                
                <div class="sidebar-widget recent-posts">
                    <h3 class="widget-title">最近文章</h3>
                    <ul id="recentList">
                        <li><a href="#">加载中…</a></li>
                    </ul>
                </div>
            </aside>
        </div>
    </div>
    
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <p>© 2025 yelou的个人博客. 保留所有权利.</p>
                </div>
                <div class="footer-links">
                    <a href="index.html">首页</a>
                </div>
            </div>
            <div class="copyright">
                <p>本网站由热爱分享的我创建和维护</p>
            </div>
        </div>
    </footer>

    <script>
        // 前台文章动态渲染：从后端 API 加载（内容由后台发布入库）
        (function () {
            function esc(s) {
                return String(s == null ? '' : s)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }
            function getCategory() {
                var m = location.search.match(/[?&]category=([^&]+)/);
                if (!m) return '';
                try { return decodeURIComponent(m[1]); } catch (e) { return ''; }
            }
            var category = getCategory();

            // 标记当前激活分类
            document.querySelectorAll('#categoryList a').forEach(function (a) {
                if ((a.getAttribute('data-cat') || '') === category) a.classList.add('active');
            });

            function fmtDate(s) {
                return String(s || '').replace('T', ' ').slice(0, 16);
            }

            function renderArticles(articles) {
                var box = document.getElementById('posts');
                if (!articles.length) {
                    box.innerHTML = '<div class="post-tip">暂无文章' + (category ? '（当前分类下）' : '') + '，敬请期待</div>';
                    return;
                }
                box.innerHTML = articles.map(function (a) {
                    var tags = (a.tags || '').split(',').filter(Boolean)
                        .map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; })
                        .join('');
                    return '<article class="post">' +
                        '<h2 class="post-title"><a href="article.html?id=' + a.id + '">' + esc(a.title) + '</a></h2>' +
                        '<div class="post-meta">' +
                        '<span>发布于: ' + fmtDate(a.created_at) + '</span> | ' +
                        '<span>分类: <a href="index.html?category=' + encodeURIComponent(a.category) + '">' + esc(a.category) + '</a></span>' +
                        (tags ? ' | <span class="post-tags">' + tags + '</span>' : '') +
                        '</div>' +
                        '<a href="article.html?id=' + a.id + '" class="read-more">阅读更多</a>' +
                        '</article>';
                }).join('');
            }

            function renderRecent(articles) {
                var ul = document.getElementById('recentList');
                if (!articles.length) {
                    ul.innerHTML = '<li><a href="#">敬请期待</a></li>';
                    return;
                }
                ul.innerHTML = articles.slice(0, 5).map(function (a) {
                    return '<li><a href="article.html?id=' + a.id + '">' + esc(a.title) + '</a></li>';
                }).join('');
            }

            var url = '/api/articles' + (category ? '?category=' + encodeURIComponent(category) : '');
            fetch(url)
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    renderArticles(d.articles || []);
                    // 最近文章取全量最新 5 篇
                    return fetch('/api/articles').then(function (r) { return r.json(); });
                })
                .then(function (d) { renderRecent(d.articles || []); })
                .catch(function () {
                    document.getElementById('posts').innerHTML =
                        '<div class="post-tip">文章加载失败，请稍后刷新重试</div>';
                });
        })();
    </script>
</body>
</html>
