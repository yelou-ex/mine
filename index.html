<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Yelou的个人博客：个人简介、教育背景与学习之路成长记录，收录学习笔记、生活感悟、技术分享与获奖经历，持续更新。">
    <meta property="og:title" content="yelou的个人博客">
    <meta property="og:description" content="Yelou的个人博客：个人简介、教育背景与学习之路成长记录，收录学习笔记、生活感悟、技术分享与获奖经历，持续更新。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yelou.pages.dev/">
    <title>yelou的个人博客 - 生活 · 学习 · 成长记录</title>
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/theme-uiverse.css">
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 内容不足一屏时让页脚始终贴底 */
        .main-wrap { flex: 1 1 auto; width: 100%; }
        
        a {
            text-decoration: none;
            color: var(--link);
        }
        
        a:hover {
            color: var(--link-hover);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* 头部样式：颜色与主题背景相反（浅色主题=黑页头，深色主题=白页头） */
        header {
            background-color: var(--header-bg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.25);
            padding: 20px 0;
            color: var(--header-text);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--header-text);
            margin: 0;  /* h1.logo 复位浏览器默认外边距 */
        }
        
        nav ul {
            display: flex;
            list-style: none;
        }
        
        nav ul li {
            margin-left: 20px;
        }
        
        nav ul li a {
            color: var(--header-text);
            font-weight: 500;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        nav ul li a:hover {
            background-color: var(--header-text);
            color: var(--header-bg);
        }
        
        /* 主要内容区域 */
        .main-content {
            display: flex;
            margin: 30px 0;
        }
        
        /* 博客文章区域 */
        .blog-posts {
            flex: 2;
            margin-right: 30px;opacity: 0.9;
        }
        
        .post {
            background-color: color-mix(in srgb, var(--card) calc(var(--card-op) * 100%), transparent);
            border-radius: 30px;
            box-shadow: var(--card-shadow);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            color: var(--card-text);
        }
        
        .post-title {
            color: var(--card-text);
            margin-bottom: 10px;
        }
        
        .post-title a {
            color: var(--card-text);
        }
        
        .post-meta {
            color: var(--card-muted);
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .post-content {
            margin-bottom: 15px;
            color: var(--card-text);
        }
        
        .read-more {
            display: inline-block;
            background-color: var(--accent);
            color: var(--accent-contrast);
            padding: 8px 15px;
            border-radius: 2px;
            font-weight: 500;
            border: 2px solid var(--accent);
            transform: skew(-18deg);
            transition: background-color 0.2s, color 0.2s, transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            box-shadow: 4px 4px 0 var(--border);
        }
        
        .read-more:hover {
            background-color: var(--accent-contrast);
            color: var(--accent);
            border-color: var(--accent-contrast);
            transform: skew(-18deg) translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--accent);
        }
        
        /* 侧边栏 */
        .sidebar {
            flex: 1;
        }
        
        /* 侧边栏常驻卡片（关于我 / 标签云 / 最近文章）：不透明，比正文卡片更实 */
        .sidebar-widget {
            background-color: var(--card);
            border-radius: 30px;
            box-shadow: var(--card-shadow);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            color: var(--card-text);
        }
        
        .widget-title {
            color: var(--card-text);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--card-stripe);
        }
        
        .about-me {
            text-align: center;
        }
        
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: block;
            object-fit: cover;
        }
        
        .recent-posts li {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--card-stripe);
            list-style: none;
            color: var(--card-text);
        }
        
        .recent-posts li:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .recent-posts li a {
            color: var(--card-text);
        }
        
        .recent-posts li a:hover {
            color: var(--card-muted);
        }
        
        /* 标签 */
        .post-tags .tag {
            display: inline-block;
            background-color: var(--card-stripe);
            color: var(--card-text);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            margin: 0 4px 4px 0;
            border: 1px solid var(--card-head);
        }
        
        /* 加载提示与空状态 */
        .post-tip {
            background-color: color-mix(in srgb, var(--card) calc(var(--card-op) * 100%), transparent);
            border-radius: 30px;
            box-shadow: var(--card-shadow);
            padding: 40px 20px;
            text-align: center;
            color: var(--card-muted);
            border: 1px solid var(--border);
        }
        
        /* 页脚 */
        footer {
            background-color: var(--footer-bg);
            color: var(--footer-text);
            padding: 30px 0;
            text-align: center;
        }
        
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .footer-links a {
            color: var(--footer-text);
            margin: 0 10px;
        }
        
        .footer-links a:hover {
            text-decoration: underline;
        }
        
        .copyright {
            border-top: 1px solid var(--border);
            padding-top: 20px;
            font-size: 14px;
        }
        
        /* 搜索框样式（与页头之间留出呼吸空间） */
        .search-bar {
            background-color: color-mix(in srgb, var(--card) calc(var(--card-op) * 100%), transparent);
            border-radius: 30px;
            box-shadow: var(--card-shadow);
            padding: 16px 20px;
            margin: 28px 0 20px;
            border: 1px solid var(--border);
        }
        .search-box {
            display: flex;
            gap: 10px;
        }
        .search-input {
            flex: 1;
            padding: 10px 14px;
            border: 4px solid #000;
            border-radius: 0;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            background: #fff;
            color: #000;
            box-shadow: 8px 8px 0 #000;
        }
        .search-input::placeholder {
            color: #888;
        }
        .search-input:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0 #000;
        }
        .search-input:focus {
            background: #000;
            color: #fff;
            border-color: #fff;
        }
        .search-input:focus::placeholder {
            color: #fff;
        }
        .search-btn {
            padding: 10px 20px;
            background-color: var(--accent);
            color: var(--accent-contrast);
            border: 2px solid var(--accent);
            border-radius: 2px;
            cursor: pointer;
            font-size: 14px;
            transform: skew(-18deg);
            box-shadow: 4px 4px 0 var(--border);
            transition: background-color .2s, color .2s, transform .2s, box-shadow .2s, border-color .2s;
        }
        .search-btn:hover {
            background-color: var(--accent-contrast);
            color: var(--accent);
            border-color: var(--accent-contrast);
            transform: skew(-18deg) translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--accent);
        }
        .clear-btn {
            padding: 10px 16px;
            background-color: var(--card-stripe);
            color: var(--card-text);
            border: 2px solid var(--card-text);
            border-radius: 2px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s, color 0.2s;
        }
        .clear-btn:hover {
            background-color: var(--card-text);
            color: var(--card-stripe);
            border-color: var(--card-text);
        }
        .active-filters {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background-color: var(--card-stripe);
            color: var(--card-text);
            border-radius: 4px;
            font-size: 13px;
            border: 1px solid var(--card-head);
        }
        .filter-tag .remove {
            cursor: pointer;
            font-weight: bold;
            opacity: 0.7;
        }
        .filter-tag .remove:hover {
            opacity: 1;
        }

        /* 标签云样式 */
        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag-item {
            display: inline-block;
            padding: 4px 12px;
            background-color: var(--card-stripe);
            color: var(--card-text);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid var(--card-head);
        }
        .tag-item:hover {
            background-color: var(--card-head);
            border-color: var(--card-text);
        }
        .tag-item.active {
            background-color: var(--card-text);
            color: var(--card);
        }
        .tag-count {
            font-size: 11px;
            opacity: 0.8;
            margin-left: 2px;
        }

        /* 手机端适配（≤ 768px） */
        @media (max-width: 768px) {
            .header-content { flex-direction: column; gap: 12px; }
            .logo { font-size: 20px; }
            nav ul li { margin-left: 12px; }
            .main-content { flex-direction: column; margin: 20px 0; }
            .blog-posts { margin-right: 0; }
            .post { padding: 16px; }
            .post-title { font-size: 18px; }
            .sidebar { margin-top: 8px; }
            .footer-content { flex-direction: column; gap: 10px; }
            .search-box { flex-direction: column; }
            .search-btn, .clear-btn { width: 100%; }

            /* 手机端隐藏头像和最近文章 */
            .about-me { display: none; }
            .recent-posts { display: none; }

            /* 手机端分类和标签云移至搜索框上方 */
            .mobile-filter-bar { display: flex !important; }
        }

        /* 手机端的分类和标签筛选栏（默认隐藏） */
        .mobile-filter-bar {
            display: none;
            background-color: color-mix(in srgb, var(--card) calc(var(--card-op) * 100%), transparent);
            border-radius: 30px;
            box-shadow: var(--card-shadow);
            padding: 12px 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .mobile-filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .mobile-filter-label {
            font-size: 14px;
            color: var(--card-muted);
            margin-right: 8px;
        }
        .mobile-cat-btn {
            padding: 6px 14px;
            background-color: var(--card-stripe);
            color: var(--card-text);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid var(--card-head);
        }
        .mobile-cat-btn:hover, .mobile-cat-btn.active {
            background-color: var(--card-text);
            color: var(--card);
        }
        .mobile-tag-btn {
            padding: 4px 12px;
            background-color: var(--card-stripe);
            color: var(--card-text);
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid var(--card-head);
        }
        .mobile-tag-btn:hover, .mobile-tag-btn.active {
            background-color: var(--card-text);
            color: var(--card);
        }

        /* 顶部分类切换（UI/分类.txt cir-tabs 风格，黑白化，放在页头「关于我」旁） */
        .top-cat-tabs {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--border);
            border-radius: 999px;
            box-shadow:
                0 1px 1px rgba(14, 17, 22, 0.04),
                0 20px 40px -24px rgba(14, 17, 22, 0.18);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        html[data-theme='dark'] .top-cat-tabs {
            background: rgba(0, 0, 0, 0.5);
        }
        .top-cat-tabs .top-cat {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 30px;
            padding: 0 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            color: var(--header-text);
            cursor: pointer;
            white-space: nowrap;
            transition:
                background-color 220ms cubic-bezier(0.22, 1, 0.36, 1),
                color 220ms cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 220ms cubic-bezier(0.22, 1, 0.36, 1);
        }
        .top-cat-tabs .top-cat:hover {
            color: var(--header-text);
        }
        .top-cat-tabs .top-cat.active {
            background: var(--header-text);
            color: var(--header-bg);
            box-shadow:
                0 1px 1px rgba(14, 17, 22, 0.06),
                0 8px 18px -10px rgba(14, 17, 22, 0.5);
        }
        /* 页头操作区横向排列：nav + 分类 + 开关 */
        .header-actions {
            gap: 16px;
        }
        @media (max-width: 768px) {
            .top-cat-tabs {
                display: none; /* 手机端用下方 mobile-filter-bar 分类 */
            }
        }
    </style>
</head>

    <script src="js/theme.js"></script>
    <script>
        // 前台文章动态渲染：从后端 API 加载（内容由后台发布入库）
        (function () {
            function esc(s) {
                return String(s == null ? '' : s)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }
            function getQueryParam(name) {
                var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
                if (!m) return '';
                try { return decodeURIComponent(m[1]); } catch (e) { return ''; }
            }

            // 读取 URL 参数
            var category = getQueryParam('category');
            var keyword = getQueryParam('keyword');
            var tag = getQueryParam('tag');

            // 初始化搜索框显示
            var searchInput = document.getElementById('searchInput');
            if (keyword) searchInput.value = keyword;

            // 标记当前激活分类（顶部分类 tabs）
            document.querySelectorAll('#topCatTabs .top-cat').forEach(function (t) {
                if ((t.getAttribute('data-cat') || '') === category) t.classList.add('active');
            });

            function fmtDate(s) {
                return String(s || '').replace('T', ' ').slice(0, 16);
            }

            // 链接安全检查：只允许 http/https/mailto、相对路径与锚点，
            // 拒绝 javascript:/data:/vbscript: 等危险协议及 //协议相对地址（防 XSS 纵深防御）
            function safeHref(v) {
                var s = String(v == null ? '' : v).trim();
                if (!s) return '';
                // 浏览器 URL 解析器会先移除 URI 中所有空白/控制字符，同步剥离再判断协议（防 "java\tscript:" 绕过）
                var stripped = s.replace(/[\u0000-\u0020]/g, '').toLowerCase();
                var m = stripped.match(/^([a-z][a-z0-9+.-]*):/);
                if (m) {
                    var scheme = m[1];
                    if (scheme !== 'http' && scheme !== 'https' && scheme !== 'mailto') return '';
                }
                if (s.slice(0, 2) === '//') return ''; // 拒绝 //evil.com 协议相对跳转
                return s;
            }

            // 渲染文章列表
            function renderArticles(articles) {
                var box = document.getElementById('posts');
                if (!articles.length) {
                    var tip = '暂无文章';
                    if (category) tip += '（当前分类：' + esc(category) + '）';
                    if (tag) tip += '（当前标签：' + esc(tag) + '）';
                    if (keyword) tip += '（关键词：' + esc(keyword) + '）';
                    tip += '，敬请期待';
                    box.innerHTML = '<div class="post-tip">' + tip + '</div>';
                    return;
                }
                box.innerHTML = articles.map(function (a) {
                    // 有 link 的文章（如三个原有静态页面）点击进入静态页面，否则进入文章详情页
                    // 用 clean URL（/article?id=N）而非 article.html?id=N：平台对 .html 的 308 归一化会丢弃 query 参数
                    // link 可能来自数据库，必须过协议白名单校验并转义，防止 javascript:/data: 等 XSS
                    var href = safeHref(a.link);
                    href = href ? esc(href) : 'article?id=' + a.id;
                    var tags = (a.tags || '').split(',').filter(Boolean)
                        .map(function (t) { return '<span class="tag" data-tag="' + esc(t) + '">' + esc(t) + '</span>'; })
                        .join('');
                    return '<article class="post">' +
                        '<h2 class="post-title"><a href="' + href + '">' + esc(a.title) + '</a></h2>' +
                        '<div class="post-meta">' +
                        '<span>发布于: ' + fmtDate(a.created_at) + '</span> | ' +
                        '<span>分类: <a href="index.html?category=' + encodeURIComponent(a.category) + '">' + esc(a.category) + '</a></span>' +
                        (tags ? ' | <span class="post-tags">' + tags + '</span>' : '') +
                        '</div>' +
                        (a.summary ? '<div class="post-content">' + esc(a.summary) + '</div>' : '') +
                        '<a href="' + href + '" class="read-more">阅读更多</a>' +
                        '</article>';
                }).join('');
            }

            // 渲染最近文章
            function renderRecent(articles) {
                var ul = document.getElementById('recentList');
                if (!articles.length) {
                    ul.innerHTML = '<li><a href="#">敬请期待</a></li>';
                    return;
                }
                ul.innerHTML = articles.slice(0, 5).map(function (a) {
                    // 同 renderArticles：link 必须过协议白名单校验并转义；详情页用 clean URL 保 query
                    var href = safeHref(a.link);
                    href = href ? esc(href) : 'article?id=' + a.id;
                    return '<li><a href="' + href + '">' + esc(a.title) + '</a></li>';
                }).join('');
            }

            // 渲染标签云
            function renderTagCloud(tags) {
                var container = document.getElementById('tagCloud');
                if (!tags || !tags.length) {
                    container.innerHTML = '<span style="color:#7f8c8d;font-size:13px;">暂无标签</span>';
                    return;
                }
                container.innerHTML = tags.map(function (t) {
                    var isActive = t.name === tag ? ' active' : '';
                    return '<span class="tag-item' + isActive + '" data-tag="' + esc(t.name) + '">' +
                        esc(t.name) +
                        '<span class="tag-count">(' + t.count + ')</span>' +
                        '</span>';
                }).join('');
            }

            // 更新 URL 参数（不刷新页面）
            function updateUrl() {
                var params = [];
                if (category) params.push('category=' + encodeURIComponent(category));
                if (keyword) params.push('keyword=' + encodeURIComponent(keyword));
                if (tag) params.push('tag=' + encodeURIComponent(tag));
                var newUrl = 'index.html' + (params.length ? '?' + params.join('&') : '');
                history.replaceState(null, '', newUrl);

                // 更新搜索框显示
                if (keyword) {
                    searchInput.value = keyword;
                    document.getElementById('clearBtn').style.display = '';
                } else {
                    searchInput.value = '';
                    document.getElementById('clearBtn').style.display = 'none';
                }

                // 更新激活筛选标签显示
                var filtersHtml = '';
                if (category) filtersHtml += '<span class="filter-tag">分类: ' + esc(category) + ' <span class="remove" data-filter="category">×</span></span>';
                if (tag) filtersHtml += '<span class="filter-tag">标签: ' + esc(tag) + ' <span class="remove" data-filter="tag">×</span></span>';
                if (keyword) filtersHtml += '<span class="filter-tag">搜索: ' + esc(keyword) + ' <span class="remove" data-filter="keyword">×</span></span>';
                document.getElementById('activeFilters').innerHTML = filtersHtml;
            }

            // 加载文章
            function loadArticles() {
                var params = [];
                if (category) params.push('category=' + encodeURIComponent(category));
                if (keyword) params.push('keyword=' + encodeURIComponent(keyword));
                if (tag) params.push('tag=' + encodeURIComponent(tag));
                var url = '/api/articles' + (params.length ? '?' + params.join('&') : '');

                fetch(url)
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        renderArticles(d.articles || []);
                        // 最近文章取全量最新 5 篇
                        return fetch('/api/articles').then(function (r) { return r.json(); });
                    })
                    .then(function (d) { renderRecent(d.articles || []); })
                    .catch(function () {
                        document.getElementById('posts').innerHTML =
                            '<div class="post-tip">文章加载失败，请稍后刷新重试</div>';
                    });
            }

            // 加载标签云
            function loadTagCloud() {
                fetch('/api/articles/tags')
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        renderTagCloud(d.tags || []);
                        renderMobileTagCloud(d.tags || []);
                    })
                    .catch(function () {
                        document.getElementById('tagCloud').innerHTML =
                            '<span style="color:#7f8c8d;font-size:13px;">标签加载失败</span>';
                        document.getElementById('mobileTagCloud').innerHTML =
                            '<span style="color:#7f8c8d;font-size:13px;">标签加载失败</span>';
                    });
            }

            // 渲染移动端标签云
            function renderMobileTagCloud(tags) {
                var container = document.getElementById('mobileTagCloud');
                if (!tags || !tags.length) {
                    container.innerHTML = '<span style="color:#7f8c8d;font-size:13px;">暂无标签</span>';
                    return;
                }
                container.innerHTML = tags.map(function (t) {
                    var isActive = t.name === tag ? ' active' : '';
                    return '<button class="mobile-tag-btn' + isActive + '" data-tag="' + esc(t.name) + '">' +
                        esc(t.name) + '</button>';
                }).join('');
            }

            // 绑定事件
            document.getElementById('searchBtn').addEventListener('click', function () {
                keyword = searchInput.value.trim();
                updateUrl();
                loadArticles();
            });

            searchInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    keyword = searchInput.value.trim();
                    updateUrl();
                    loadArticles();
                }
            });

            document.getElementById('clearBtn').addEventListener('click', function () {
                keyword = '';
                searchInput.value = '';
                updateUrl();
                loadArticles();
            });

            // 顶部分类 tabs 点击（与侧边栏分类联动）
            document.querySelectorAll('#topCatTabs .top-cat').forEach(function (tab) {
                tab.addEventListener('click', function () {
                    category = this.getAttribute('data-cat') || '';
                    document.querySelectorAll('#topCatTabs .top-cat').forEach(function (t) { t.classList.remove('active'); });
                    this.classList.add('active');
                    updateUrl();
                    loadArticles();
                });
            });

            // 同步：URL 有分类参数时，标记顶部分类 tabs 的激活态
            (function syncTopCat() {
                var active = document.querySelector('#topCatTabs .top-cat[data-cat="' + (category || '') + '"]')
                    || (category ? null : document.querySelector('#topCatTabs .top-cat[data-cat=""]'));
                document.querySelectorAll('#topCatTabs .top-cat').forEach(function (t) {
                    t.classList.toggle('active', t === active || (!category && t.getAttribute('data-cat') === ''));
                });
            })();

            // 顶部分类激活态同步（所有入口共用）
            function syncTopCatActive(cat) {
                document.querySelectorAll('#topCatTabs .top-cat').forEach(function (t) {
                    t.classList.toggle('active', (t.getAttribute('data-cat') || '') === (cat || ''));
                });
            }

            // 桌面端标签云点击
            document.getElementById('tagCloud').addEventListener('click', function (e) {
                var item = e.target.closest('.tag-item');
                if (!item) return;
                tag = item.getAttribute('data-tag');
                updateUrl();
                loadArticles();
            });

            // 移动端分类按钮点击
            document.querySelectorAll('.mobile-cat-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    category = this.getAttribute('data-cat') || '';
                    // 更新激活状态
                    document.querySelectorAll('.mobile-cat-btn').forEach(function (b) {
                        b.classList.remove('active');
                    });
                    this.classList.add('active');
                    updateUrl();
                    loadArticles();
                });
            });

            // 移动端标签按钮点击
            document.getElementById('mobileTagCloud').addEventListener('click', function (e) {
                var btn = e.target.closest('.mobile-tag-btn');
                if (!btn) return;
                tag = btn.getAttribute('data-tag');
                // 更新激活状态
                document.querySelectorAll('.mobile-tag-btn').forEach(function (b) {
                    b.classList.remove('active');
                });
                btn.classList.add('active');
                updateUrl();
                loadArticles();
            });

            // 清除筛选
            document.getElementById('activeFilters').addEventListener('click', function (e) {
                var remove = e.target.closest('.remove');
                if (!remove) return;
                var filterType = remove.getAttribute('data-filter');
                if (filterType === 'category') category = '';
                else if (filterType === 'tag') tag = '';
                else if (filterType === 'keyword') {
                    keyword = '';
                    searchInput.value = '';
                    document.getElementById('clearBtn').style.display = 'none';
                }
                updateUrl();
                loadArticles();
            });

            // 初始化
            updateUrl();
            loadArticles();
            loadTagCloud();
        })();
    </script>
</body>
</html>
