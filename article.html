<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="杨楼的个人博客文章页：学习笔记与生活感悟。">
    <meta property="og:title" content="文章详情 - yelou的个人博客">
    <meta property="og:description" content="杨楼的个人博客文章页：学习笔记与生活感悟。">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://yelou.pages.dev/article">
    <title>文章详情 - yelou的个人博客</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', 'Microsoft YaHei', sans-serif; }
        body {
            background-image: url("picture/d3SJaPgZhqMVOQv.thumb.png");
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* 内容不足一屏时让页脚始终贴底 */
        .main-wrap { flex: 1 1 auto; width: 100%; }
        a { text-decoration: none; color: #3498db; }
        a:hover { color: #2980b9; }
        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
        header {
            background-color: #fff; opacity: 0.85;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px 0;
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: #2c3e50; }
        nav ul { display: flex; list-style: none; }
        nav ul li { margin-left: 20px; }
        nav ul li a { color: #2c3e50; font-weight: 500; padding: 5px 10px; border-radius: 4px; transition: background-color 0.3s; }
        nav ul li a:hover { background-color: #ecf0f1; }
        .article-wrap {
            background-color: #fff; opacity: 0.95;
            border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 36px 40px; margin: 30px 0;
        }
        .article-title { color: #2c3e50; font-size: 26px; margin-bottom: 12px; }
        .article-meta { color: #7f8c8d; font-size: 14px; margin-bottom: 8px; }
        .article-tags { margin-bottom: 22px; }
        .article-tags .tag {
            display: inline-block; background-color: #eaf2f8; color: #2980b9;
            border-radius: 4px; padding: 2px 10px; font-size: 12px; margin: 0 4px 4px 0;
        }
        .article-body { border-top: 1px solid #ecf0f1; padding-top: 24px; font-size: 15.5px; color: #34495e; word-break: break-word; }
        .article-body img { max-width: 100%; height: auto; border-radius: 6px; }
        .article-body a { word-break: break-all; }
        .article-body blockquote {
            border-left: 4px solid #3498db; background: #f8f9fa;
            padding: 10px 16px; margin: 14px 0; color: #7f8c8d;
        }
        .article-body pre {
            background: #2c3e50; color: #ecf0f1; border-radius: 6px;
            padding: 14px 16px; overflow-x: auto; margin: 14px 0;
        }
        .article-body code { font-family: Consolas, monospace; }
        .article-body h1,.article-body h2,.article-body h3,.article-body h4 { color: #2c3e50; margin: 20px 0 10px; }
        /* 文内目录锚点跳转：平滑滚动 */
        html { scroll-behavior: smooth; }
        /* 双栏布局（PC ≥769px）：文章占满左侧，目录模块为右侧独立卡片；
           body.has-toc 由前端 initToc / 服务端预渲染在目录可见时添加。
           目录列 stretch 到整栏高度（align-items:stretch），卡片 sticky 才能在
           整篇文章翻动过程中始终浮在视口内（顶距 20px） */
        @media (min-width: 769px) {
            body.has-toc .container { max-width: 1160px; }
            .layout { display: grid; grid-template-columns: minmax(0, 1fr) 232px; gap: 28px; align-items: stretch; }
            .toc-card {
                position: sticky; top: 20px;
                background: #fff; opacity: .95;
                border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,.1);
                padding: 14px 16px;
                max-height: calc(100vh - 40px); overflow-y: auto;
            }
            .toc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
            .toc-title { font-size: 15px; font-weight: 600; color: #2c3e50; }
            /* 卡片上的「评论」「首页」按钮（共用胶囊样式）：评论 → 页内锚点 #commentWrap，首页 → index.html */
            .toc-actions { display: flex; gap: 6px; }
            .toc-btn {
                font-size: 12px; color: #3498db; background: #eaf2f8;
                padding: 3px 10px; border-radius: 4px; text-decoration: none;
                transition: background-color .2s, color .2s;
            }
            .toc-btn:hover { background: #3498db; color: #fff; }
            .toc-list a {
                display: block; padding: 4px 8px; margin: 1px 0;
                color: #7f8c8d; font-size: 13.5px; line-height: 1.45;
                border-left: 2px solid transparent; border-radius: 0 4px 4px 0;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                transition: color .2s, border-color .2s, background-color .2s;
            }
            .toc-list a:hover { color: #2980b9; }
            .toc-list a.lvl-3 { padding-left: 22px; font-size: 12.5px; }
            .toc-list a.lvl-4 { padding-left: 36px; font-size: 12px; }
            .toc-list a.active { color: #3498db; border-left-color: #3498db; background: #f4f8fb; }
        }
        /* 移动端（≤768px）：不展示目录模块，单栏居中 */
        @media (max-width: 768px) {
            .toc-col { display: none; }
        }
        /* 表格（Markdown GFM 表格 / HTML 表格共用） */
        .article-body table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14.5px; }
        .article-body th, .article-body td { border: 1px solid #e3e8ee; padding: 8px 12px; text-align: left; }
        .article-body th { background: #f2f5f9; color: #2c3e50; font-weight: 600; }
        .article-body tr:nth-child(even) td { background: #fafbfc; }
        .article-body caption { caption-side: bottom; color: #7f8c8d; font-size: 13px; padding-top: 6px; }
        .article-body .md-fallback { background: #f6f8fa; padding: 14px 16px; border-radius: 6px; white-space: pre-wrap; font-size: 14px; }
        .table-scroll { overflow-x: auto; }
        .back-bar { margin: 24px 0 0; }
        .back-bar a { color: #7f8c8d; font-size: 14px; }
        .back-bar a:hover { color: #3498db; }
        footer { background-color: #2c3e50; color: #ecf0f1; padding: 30px 0; text-align: center; }
        .copyright { font-size: 14px; }
        .post-tip { background-color: #fff; border-radius: 8px; padding: 40px 20px; text-align: center; color: #7f8c8d; margin: 30px 0; }
        /* 评论区（REQ-25 / REQ-27） */
        /* 目录卡片「评论」按钮锚点 #commentWrap 的落地偏移（与 sticky 卡片顶距一致） */
        #commentWrap { scroll-margin-top: 20px; }
        .comments-wrap { background-color: #fff; opacity: 0.95; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 24px 40px; margin: 0 0 30px; }
        .comments-title { color: #2c3e50; font-size: 18px; margin: 0 0 14px; }
        .comments-title .count { color: #7f8c8d; font-size: 14px; font-weight: normal; }
        .comment-item { border-top: 1px solid #ecf0f1; padding: 14px 0; }
        .comment-item:first-child { border-top: none; }
        .comment-head { font-size: 13px; color: #7f8c8d; margin-bottom: 6px; }
        .comment-head .nickname { color: #2c3e50; font-weight: bold; margin-right: 8px; }
        .comment-content { font-size: 14.5px; color: #34495e; word-break: break-word; white-space: pre-wrap; }
        .comment-empty { color: #7f8c8d; font-size: 14px; padding: 10px 0; }
        .comment-form { border-top: 1px solid #ecf0f1; margin-top: 18px; padding-top: 18px; }
        .comment-form .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .comment-form input, .comment-form textarea { flex: 1; min-width: 0; border: 1px solid #dfe4e8; border-radius: 4px; padding: 8px 10px; font-size: 14px; font-family: inherit; }
        .comment-form input:focus, .comment-form textarea:focus { outline: none; border-color: #3498db; }
        .comment-form .field-name { flex: 0 0 42%; }
        .comment-form textarea { resize: vertical; min-height: 80px; }
        .comment-form .btn-submit { background: #3498db; color: #fff; border: none; border-radius: 4px; padding: 8px 22px; font-size: 14px; cursor: pointer; touch-action: manipulation; }
        .comment-form .btn-submit:hover { background: #2980b9; }
        .comment-form .btn-submit:disabled { background: #9dc9e8; cursor: not-allowed; }
        .comment-msg { font-size: 13px; margin-top: 8px; min-height: 16px; }
        .comment-msg.error { color: #e74c3c; }
        .comment-msg.ok { color: #27ae60; }
        /* 点赞按钮（文章 meta 行 + 评论操作行共用） */
        .like-btn {
            font-size: 12.5px; color: #7f8c8d; background: #f4f6f8;
            border: 1px solid #e3e8ee; border-radius: 12px; padding: 2px 10px; cursor: pointer;
            transition: color .2s, background-color .2s, border-color .2s;
        }
        .like-btn:hover { color: #e67e22; border-color: #f0c8a0; background: #fdf4ea; }
        .like-btn.on { color: #fff; background: #e67e22; border-color: #e67e22; }
        .like-btn.on:hover { background: #d35400; }
        .article-like { margin-left: 10px; vertical-align: middle; }
        /* 评论操作行：点赞 + 回复（回复仅顶级评论显示） */
        .comment-actions { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
        .cm-reply { font-size: 12.5px; color: #7f8c8d; background: none; border: none; cursor: pointer; padding: 2px 4px; }
        .cm-reply:hover { color: #3498db; }
        /* 嵌套回复（一级）：缩进 + 弱化样式 */
        .comment-replies { margin-top: 10px; padding-left: 14px; border-left: 2px solid #ecf0f1; }
        .comment-item.reply .comment-head { font-size: 12px; }
        .comment-item.reply .comment-content { font-size: 13.5px; }
        /* 内联回复表单 */
        .reply-form { margin-top: 10px; padding: 10px 12px; background: #f8f9fa; border-radius: 6px; }
        .reply-form input, .reply-form textarea {
            width: 100%; box-sizing: border-box; border: 1px solid #dfe4e8; border-radius: 4px;
            padding: 7px 9px; font-size: 13px; font-family: inherit; margin-bottom: 8px;
        }
        .reply-form textarea { resize: vertical; min-height: 56px; }
        .reply-btns { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .reply-cancel { font-size: 12.5px; color: #7f8c8d; background: #ecf0f1; border: none; border-radius: 4px; padding: 6px 14px; cursor: pointer; }
        .reply-cancel:hover { background: #dfe4e8; }
        /* 手机端适配（≤ 768px） */
        @media (max-width: 768px) {
            .header-content { flex-direction: column; gap: 12px; }
            .logo { font-size: 20px; }
            nav ul li { margin-left: 12px; }
            .article-wrap { padding: 20px 16px; margin: 16px 0; }
            .article-title { font-size: 20px; }
            .article-body { font-size: 14.5px; }
            .comments-wrap { padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); margin: 0 0 16px; }
            .comments-title { font-size: 16px; }
            .comment-content { font-size: 14px; line-height: 1.6; }
            /* 手机端评论 UI（REQ-34 / 5.5.5）：单列表单 + 点击目标 ≥44px + 16px 字号防 iOS 自动缩放 */
            .comment-form input, .comment-form textarea { font-size: 16px; padding: 11px 12px; }
            .comment-form .row { flex-direction: column; gap: 8px; }
            .comment-form .field-name { flex: 1 1 auto; }
            .comment-form textarea { min-height: 72px; }
            .comment-form .btn-submit { width: 100%; padding: 12px; font-size: 16px; }
            .comment-msg { margin-top: 10px; }
            .reply-form input, .reply-form textarea { font-size: 16px; }
        }
    </style>
</head>
<body>

        <div class="container">

                <div class="logo"><a href="index.html" style="color:#2c3e50;">Yelou个人博客</a></div>

    <div class="container main-wrap">
        <!-- PC 双栏：文章占左，目录模块（独立卡片）置右上；≤768px 隐藏目录回到单栏。
             articleWrap 保持折叠空 div：functions/article.js 预渲染注入点依赖该字面量 -->
        <div class="layout" id="layout">

            </div>

            </div>
        </div>
    </footer>

    <!-- DOMPurify：文章富文本的前端 XSS 二次过滤库；CDN 不可用时内联脚本自动回退到强化版本地白名单渲染器 -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <!-- marked（本地打包）：Markdown 格式文章的源码 → HTML 渲染器；不可用时回退为原文纯文本展示（esc 转义，无 XSS 面） -->
    <script src="js/marked.js"></script>
    <!-- 标题锚点：为 md 标题追加 GitHub 风格 id（重名 -1/-2），使文内目录 [文字](#标题) 可点击跳转；白名单需放行 id -->
    <script src="js/heading-ids.js"></script>
    <script>
        // 文章详情：从后端 API 加载；渲染前做前端白名单二次过滤（防 XSS 第二道防线）
        (function () {
            function esc(s) {
                return String(s == null ? '' : s)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }
            // 白名单与后端（functions/_lib.mjs）保持一致：标签/属性
            var ALLOWED_TAGS = ['p', 'br', 'strong', 'em', 'b', 'i', 'u', 'del', 's',
                'ul', 'ol', 'li', 'a', 'img', 'span', 'div', 'hr',
                'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'blockquote', 'code', 'pre',
                'table', 'thead', 'tbody', 'tr', 'th', 'td', 'caption'];
            var ALLOWED_ATTRS = {
                a: ['href', 'title', 'target', 'rel'],
                img: ['src', 'alt', 'title'],
                th: ['colspan', 'rowspan'],
                td: ['colspan', 'rowspan']
            };
            var SAFE_SCHEMES = { http: 1, https: 1, mailto: 1 };

            // URI 安全检查：仅允许 http/https/mailto、相对路径与锚点；
            // 拒绝 javascript:/data:/vbscript: 及 // 协议相对地址（含空白控制字符绕过）
            function isSafeUri(v) {
                var s = String(v == null ? '' : v);
                var stripped = s.replace(/[\u0000-\u0020]/g, '').toLowerCase();
                if (!stripped) return true; // 空值
                var m = stripped.match(/^([a-z][a-z0-9+.-]*):/);
                if (m) return !!SAFE_SCHEMES[m[1]]; // 有协议：仅白名单协议
                if (s.slice(0, 2) === '//') return false; // 拒绝 //evil.com
                return true; // 相对路径 / 锚点
            }

            // 强化版本地渲染器（DOMPurify 不可用时的回退）：
            // 标签白名单 + 属性白名单 + URI 协议白名单，覆盖 data:/xlink:svg/MathML 等已知绕过面
            function safeRenderLocal(html) {
                var tpl = document.createElement('template');
                tpl.innerHTML = String(html == null ? '' : html);
                // 整体移除危险/命名空间元素（含 svg/math/base/noscript 等绕过载体）
                tpl.content.querySelectorAll(
                    'script, style, iframe, object, embed, applet, base, link, meta, ' +
                    'form, input, button, textarea, select, option, svg, math, ' +
                    'noscript, template, picture, source, video, audio, details, summary, marquee'
                ).forEach(function (n) { n.remove(); });
                // 属性白名单：非白名单属性（on*、style、xlink:* 等）一律移除
                tpl.content.querySelectorAll('*').forEach(function (el) {
                    var allowed = ALLOWED_ATTRS[el.tagName.toLowerCase()] || [];
                    Array.prototype.slice.call(el.attributes).forEach(function (attr) {
                        var name = attr.name.toLowerCase();
                        var keep = allowed.indexOf(name) !== -1;
                        // 标题锚点 id（目录跳转）：全标签放行，但值限定严格字符集，防畸形/注入
                        if (!keep && name === 'id' && /^[\p{L}\p{N}\-_.]+$/u.test(attr.value)) keep = true;
                        if (keep && (name === 'href' || name === 'src') && !isSafeUri(attr.value)) keep = false;
                        if (!keep) el.removeAttribute(attr.name);
                    });
                });
                return tpl.innerHTML;
            }

            // 前端二次过滤：优先使用 DOMPurify（已知绕过面全覆盖），CDN 不可用时回退到强化版本地白名单渲染器
            function safeRender(html) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(String(html == null ? '' : html), {
                        ALLOWED_TAGS: ALLOWED_TAGS,
                        // id：标题锚点（目录跳转）；锚点目标由 js/heading-ids.js 生成、字符集受限
                        ALLOWED_ATTR: ['href', 'title', 'target', 'rel', 'src', 'alt', 'colspan', 'rowspan', 'id'],
                    });
                }
                return safeRenderLocal(html);
            }

            // Markdown 渲染：marked 转 HTML，为标题追加 GitHub 风格锚点 id（文内目录 [文字](#标题)
            // 点击可跳转；重名自动 -1/-2），随后仍走 safeRender 白名单过滤（二次防线）；
            // 渲染器不可用时回退为 esc 转义后的纯文本展示（可读、无 XSS 面）
            function renderMarkdown(md) {
                if (window.marked && typeof window.marked.parse === 'function') {
                    var rendered = window.marked.parse(String(md == null ? '' : md));
                    if (typeof addHeadingIds === 'function') rendered = addHeadingIds(rendered);
                    return safeRender(rendered);
                }
                return '<div class="md-fallback">' + esc(md) + '</div>';
            }

            // DOMPurify 钩子：在默认规则之外强制 URI 协议白名单（作用于实体解码后的属性值，
            // 可覆盖 data:/vbscript:/javascript: 及实体混淆绕过）；并为外链补 rel="noopener"
            if (window.DOMPurify) {
                window.DOMPurify.addHook('beforeSanitizeAttributes', function (node) {
                    if (!node.attributes) return; // 文本/注释节点无属性
                    for (var i = node.attributes.length - 1; i >= 0; i--) {
                        var name = node.attributes[i].name.toLowerCase();
                        if ((name === 'href' || name === 'src' || name === 'xlink:href')
                            && !isSafeUri(node.attributes[i].value)) {
                            node.removeAttribute(node.attributes[i].name);
                        }
                    }
                });
                window.DOMPurify.addHook('afterSanitizeAttributes', function (node) {
                    if (node.hasAttribute && node.hasAttribute('target')) {
                        var rel = node.getAttribute('rel') || '';
                        if (rel.indexOf('noopener') === -1) {
                            node.setAttribute('rel', (rel + ' noopener').trim());
                        }
                    }
                });
            }
            function fmtDate(s) {
                return String(s || '').replace('T', ' ').slice(0, 16);
            }
            /* ---------- 目录模块（PC 右上独立卡片，文章占满左侧；规则见 CSS 与 _lib.mjs buildTocHtml） ---------- */
            var tocScrollFn = null; // scroll-spy 监听（重建目录时先解绑旧监听）
            function hideToc() {
                var tocCol = document.getElementById('tocCol');
                if (tocCol) { tocCol.hidden = true; tocCol.innerHTML = ''; }
                document.body.classList.remove('has-toc');
                if (tocScrollFn) { window.removeEventListener('scroll', tocScrollFn); tocScrollFn = null; }
            }
            function initTocSpy(heads) {
                var links = Array.prototype.slice.call(document.querySelectorAll('#tocList a'));
                if (!links.length) return;
                var ticking = false;
                function update() {
                    ticking = false;
                    var line = window.scrollY + 96; // 视口顶部 + 页头余量
                    var active = -1;
                    for (var i = 0; i < heads.length; i++) {
                        if (heads[i].getBoundingClientRect().top + window.scrollY <= line) active = i; else break;
                    }
                    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) active = heads.length - 1; // 页底高亮末项
                    links.forEach(function (a, i) { a.classList.toggle('active', i === active); });
                }
                if (tocScrollFn) window.removeEventListener('scroll', tocScrollFn);
                tocScrollFn = function () {
                    if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
                };
                window.addEventListener('scroll', tocScrollFn, { passive: true });
                update();
            }
            function initToc() {
                var tocCol = document.getElementById('tocCol');
                if (!tocCol) return;
                var body = document.querySelector('#articleWrap .article-body');
                var heads = body ? Array.prototype.slice.call(body.querySelectorAll('h2, h3, h4')) : [];
                if (heads.length < 2) { hideToc(); return; } // 标题太少不值得展示目录
                // 无 id 的标题（html 格式文章）按 heading-ids 规则补生成，重名 -1/-2；与预渲染 buildTocHtml 同规则
                var used = {};
                heads.forEach(function (h) { if (h.hasAttribute('id')) used[h.getAttribute('id')] = 1; });
                heads.forEach(function (h) {
                    if (h.hasAttribute('id')) return;
                    var base = typeof headingSlug === 'function' ? headingSlug(h.textContent) : '';
                    if (!base) { h.setAttribute('data-toc-skip', '1'); return; } // 无 slug 标题不入目录
                    var n = 0, sid = base;
                    while (used[sid]) { n += 1; sid = base + '-' + n; }
                    used[sid] = 1;
                    h.setAttribute('id', sid);
                });
                var entries = heads.filter(function (h) { return !h.hasAttribute('data-toc-skip'); });
                if (entries.length < 2) { hideToc(); return; }
                tocCol.innerHTML =
                    '<div class="toc-card">' +
                    '<div class="toc-head"><span class="toc-title">目录</span>' +
                    '<span class="toc-actions">' +
                    '<a class="toc-btn toc-comment" href="#commentWrap" title="跳到评论区">评论</a>' +
                    '<a class="toc-btn toc-home" href="index.html" title="返回首页">首页</a>' +
                    '</span></div>' +
                    '<nav class="toc-list" id="tocList">' +
                    entries.map(function (h) {
                        var cls = h.tagName === 'H2' ? 'lvl-2' : (h.tagName === 'H3' ? 'lvl-3' : 'lvl-4');
                        return '<a class="' + cls + '" href="#' + encodeURIComponent(h.getAttribute('id')) + '">' + esc(h.textContent.trim()) + '</a>';
                    }).join('') +
                    '</nav></div>';
                tocCol.hidden = false;
                document.body.classList.add('has-toc');
                initTocSpy(entries);
            }

            var id = (location.search.match(/[?&]id=(\d+)/) || [])[1];
            // articleWrap 为壳内空 div：无预渲染正文时先展示加载占位（预渲染页保留正文，不覆写）
            var wrap0 = document.getElementById('articleWrap');
            if (!wrap0.hasAttribute('data-prerendered')) wrap0.innerHTML = '<div class="post-tip">文章加载中…</div>';
            if (!id) {
                wrap0.innerHTML = '<div class="post-tip">文章不存在</div>';
                hideToc();
            } else {
                fetch('/api/articles/' + id)
                    .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
                    .then(function (r) {
                        var wrap = document.getElementById('articleWrap');
                        if (r.status !== 200) {
                            // 预渲染内容存在时保留正文（文章在页面加载后被删除等竞态场景，不毁掉已渲染的内容）
                            if (!wrap.hasAttribute('data-prerendered')) {
                                wrap.innerHTML = '<div class="post-tip">' + esc(r.data.message || '文章不存在') + '</div>';
                                hideToc();
                            } else {
                                initToc(); // 从保留的预渲染正文构建目录
                            }
                            return;
                        }
                        var a = r.data.article;
                        var tags = (a.tags || '').split(',').filter(Boolean)
                            .map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; })
                            .join('');
                        document.title = a.title + ' - yelou的个人博客';
                        // 动态刷新 SEO / 社交 meta（爬虫首抓读壳内默认值，社交分享读动态值）
                        var metaDesc = document.querySelector('meta[name="description"]');
                        if (metaDesc) {
                            var t = String(a.content || '').replace(/<[^>]*>/g, ' ').replace(/[#*`|~>-]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80);
                            metaDesc.setAttribute('content', t ? t + ' - yelou的个人博客' : '文章详情 - yelou的个人博客');
                        }
                        var ogT = document.querySelector('meta[property="og:title"]');
                        if (ogT) ogT.setAttribute('content', a.title + ' - yelou的个人博客');
                        var ogD = document.querySelector('meta[property="og:description"]');
                        if (ogD && metaDesc) ogD.setAttribute('content', metaDesc.getAttribute('content'));
                        var ogU = document.querySelector('meta[property="og:url"]');
                        if (ogU) ogU.setAttribute('content', location.href);
                        // 按内容格式渲染：markdown 走 marked + 白名单过滤；html 走原有白名单管线
                        var bodyHtml = (a.format === 'markdown') ? renderMarkdown(a.content) : safeRender(a.content);
                        wrap.innerHTML =
                            '<article class="article-wrap">' +
                            '<h1 class="article-title">' + esc(a.title) + '</h1>' +
                            '<div class="article-meta">发布于: ' + fmtDate(a.created_at) + ' | 分类: ' + esc(a.category) + (a.format === 'markdown' ? ' | Markdown' : '') +
                            ' <button type="button" class="like-btn article-like" id="articleLikeBtn"></button></div>' +
                            (tags ? '<div class="article-tags">' + tags + '</div>' : '') +
                            '<div class="table-scroll"><div class="article-body">' + bodyHtml + '</div></div>' +
                            '</article>';
                        initComments();
                        initToc(); // 渲染完成后构建目录模块（正文无 ≥2 个标题时自动隐藏）
                        initArticleLike(a.likes || 0); // 文章点赞按钮（初始数量来自 API）
                    })
                    .catch(function () {
                        var wrap = document.getElementById('articleWrap');
                        // 网络失败但有预渲染正文时保留内容，不清屏
                        if (!wrap.hasAttribute('data-prerendered')) {
                            wrap.innerHTML = '<div class="post-tip">文章加载失败，请稍后重试</div>';
                            hideToc();
                        } else {
                            initToc();
                        }
                    });
            }

            /* ---------- 评论区（REQ-25 ~ 28 / BC-27 ~ 31） ---------- */
            function initComments() {
                document.getElementById('commentWrap').innerHTML =
                    '<div class="comments-wrap">' +
                    '<h2 class="comments-title">评论<span class="count" id="commentCount"></span></h2>' +
                    '<div id="commentList"><div class="post-tip" style="padding:14px 0;margin:0;">评论加载中…</div></div>' +
                    '<div class="comment-form">' +
                    '<div class="row">' +
                    '<input id="c-nickname" class="field-name" maxlength="20" placeholder="昵称（必填）">' +
                    '<input id="c-email" type="email" maxlength="50" placeholder="邮箱（选填仅后台可见）">' +
                    '</div>' +
                    '<textarea id="c-content" rows="3" maxlength="1000" placeholder="写下你的评论…（≤ 1000 字符）"></textarea>' +
                    '<div style="display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;">' +
                    '<button type="button" class="btn-submit" id="c-submit">发表评论</button>' +
                    '<div id="c-msg" class="comment-msg"></div>' +
                    '</div>' +
                    '</div>' +
                    '</div>';
                loadComments();
                document.getElementById('c-submit').addEventListener('click', submitComment);
                // 评论列表内的点赞/回复按钮：事件委托（动态回复表单也由此统一处理）
                document.getElementById('commentList').addEventListener('click', onCommentListClick);
            }

            var justPosted = false; // 5.5.5：仅当本页刚提交成功时，刷新后自动滚动定位新评论
            var justPostedId = 0;    // 回复成功后定位到该评论（含嵌套层级）
            var repliesByParent = {}; // 评论 id → 其回复数组（renderComments 填充，commentNode 读取）
            function commentNode(c, isReply) {
                var acts = '<div class="comment-actions">' +
                    '<button type="button" class="like-btn cm-like' +
                    (localStorage.getItem('yslike_c_' + c.id) === '1' ? ' on' : '') +
                    '" data-id="' + c.id + '"><span id="likeC_' + c.id + '">👍 ' + (c.likes || 0) + '</span></button>';
                if (!isReply) acts += '<button type="button" class="cm-reply" data-id="' + c.id + '">回复</button>';
                acts += '</div>';
                var inner =
                    '<div class="comment-head"><span class="nickname">' + esc(c.nickname) + '</span>' +
                    esc(fmtDate(c.created_at)) + '</div>' +
                    '<div class="comment-content">' + esc(c.content) + '</div>' +
                    acts;
                if (!isReply) {
                    var reps = repliesByParent[c.id];
                    if (reps && reps.length) {
                        inner += '<div class="comment-replies">' +
                            reps.map(function (rc) {
                                return '<div class="comment-item reply" data-id="' + rc.id + '">' + commentNode(rc, true) + '</div>';
                            }).join('') +
                            '</div>';
                    }
                }
                return '<div class="comment-item' + (isReply ? ' reply' : '') + '" data-id="' + c.id + '">' + inner + '</div>';
            }
            function renderComments(data) {
                document.getElementById('commentCount').textContent = '（' + data.count + '）';
                var list = document.getElementById('commentList');
                if (!data.comments.length) {
                    list.innerHTML = '<div class="comment-empty">暂无评论，快来抢沙发</div>';
                    justPosted = false;
                    justPostedId = 0;
                    return;
                }
                // 分组：顶级评论（parent_id=0/缺省）+ 其回复（仅一级嵌套）
                var topLevel = [];
                repliesByParent = {};
                data.comments.forEach(function (c) {
                    if (c.parent_id) { (repliesByParent[c.parent_id] = repliesByParent[c.parent_id] || []).push(c); }
                    else { topLevel.push(c); }
                });
                list.innerHTML = topLevel.map(function (c) { return commentNode(c, false); }).join('');
                if (justPostedId) {
                    var el = list.querySelector('.comment-item[data-id="' + justPostedId + '"]');
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    justPostedId = 0;
                } else if (justPosted) {
                    justPosted = false;
                    var last = list.querySelector('.comment-item:last-child');
                    if (last) last.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }

            function loadComments() {
                fetch('/api/articles/' + id + '/comments')
                    .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
                    .then(function (r) {
                        var list = document.getElementById('commentList');
                        if (!list) return;
                        if (r.status === 200) { renderComments(r.data); return; }
                        list.innerHTML = '<div class="comment-empty">' + esc(r.data.message || '评论加载失败') + '</div>';
                    })
                    .catch(function () {
                        var list = document.getElementById('commentList');
                        if (list) list.innerHTML = '<div class="comment-empty">评论加载失败，请稍后重试</div>';
                    });
            }

            var commentSubmitting = false;
            function submitComment() {
                if (commentSubmitting) return;
                var nickname = document.getElementById('c-nickname').value.trim();
                var email = document.getElementById('c-email').value.trim();
                var content = document.getElementById('c-content').value;
                var msg = document.getElementById('c-msg');
                msg.className = 'comment-msg';
                msg.textContent = '';
                // 前端校验（REQ-26 / BC-27 ~ 30），与后端规则一致
                if (!nickname) { msg.textContent = '昵称不能为空'; msg.classList.add('error'); return; }
                if (nickname.length > 20) { msg.textContent = '昵称不能超过 20 个字符'; msg.classList.add('error'); return; }
                if (!content.trim() || !content.replace(/<[^>]*>/g, '').trim()) {
                    msg.textContent = '评论内容不能为空'; msg.classList.add('error'); return;
                }
                if (content.length > 1000) { msg.textContent = '评论内容不能超过 1000 个字符'; msg.classList.add('error'); return; }
                if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    msg.textContent = '邮箱格式不正确'; msg.classList.add('error'); return;
                }
                commentSubmitting = true;
                var btn = document.getElementById('c-submit');
                btn.disabled = true;
                btn.textContent = '提交中…';
                fetch('/api/articles/' + id + '/comments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname: nickname, email: email, content: content })
                })
                    .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
                    .then(function (r) {
                        if (r.status === 200) {
                            msg.textContent = r.data.message || '评论发布成功';
                            msg.className = 'comment-msg ok';
                            document.getElementById('c-content').value = '';
                            localStorage.setItem('ys_nick', nickname); // 回复表单预填昵称
                            justPosted = true; // 刷新后自动滚动到最新一条
                            loadComments();
                        } else {
                            msg.textContent = r.data.message || '评论发布失败，请稍后重试';
                            msg.className = 'comment-msg error';
                        }
                    })
                    .catch(function () {
                        msg.textContent = '评论发布失败，请稍后重试';
                        msg.className = 'comment-msg error';
                    })
                    .finally(function () {
                        commentSubmitting = false;
                        btn.disabled = false;
                        btn.textContent = '发表评论';
                    });
            }

            /* ---------- 文章点赞（按 IP 幂等切换：再点取消；按钮态存 localStorage） ---------- */
            function initArticleLike(initialLikes) {
                var btn = document.getElementById('articleLikeBtn');
                if (!btn) return;
                var likes = Number(initialLikes) || 0;
                var liked = localStorage.getItem('yslike_a_' + id) === '1';
                function paint() {
                    btn.textContent = '👍 ' + (liked ? '已赞' : '点赞') + '（' + likes + '）';
                    btn.classList.toggle('on', liked);
                }
                paint();
                btn.addEventListener('click', function () {
                    fetch('/api/articles/' + id + '/like', { method: 'POST' })
                        .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
                        .then(function (r) {
                            if (r.status !== 200) return;
                            liked = !!r.data.liked;
                            likes = Number(r.data.likes) || 0;
                            localStorage.setItem('yslike_a_' + id, liked ? '1' : '0');
                            paint();
                        })
                        .catch(function () {});
                });
            }

            /* ---------- 评论点赞切换 ---------- */
            function toggleCommentLike(btn, cmId) {
                fetch('/api/comments/' + cmId + '/like', { method: 'POST' })
                    .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
                    .then(function (r) {
                        if (r.status !== 200) return;
                        localStorage.setItem('yslike_c_' + cmId, r.data.liked ? '1' : '0');
                        btn.classList.toggle('on', !!r.data.liked);
                        var n = document.getElementById('likeC_' + cmId);
                        if (n) n.textContent = '👍 ' + (Number(r.data.likes) || 0);
                    })
                    .catch(function () {});
            }

            /* ---------- 内联回复表单（点「回复」在目标评论下展开；仅顶级评论可回复） ---------- */
            function openReplyForm(cmId) {
                var list = document.getElementById('commentList');
                if (!list) return;
                var item = list.querySelector('.comment-item[data-id="' + cmId + '"]:not(.reply)');
                if (!item || item.querySelector('.reply-form')) return;
                var nick = localStorage.getItem('ys_nick') || '';
                var form = document.createElement('div');
                form.className = 'reply-form';
                form.setAttribute('data-parent', cmId);
                form.innerHTML =
                    '<input class="reply-nick" maxlength="20" placeholder="昵称（必填）" value="' + esc(nick) + '">' +
                    '<textarea rows="2" maxlength="1000" placeholder="写下你的回复…（≤ 1000 字符）"></textarea>' +
                    '<div class="reply-btns">' +
                    '<button type="button" class="btn-submit reply-submit">提交回复</button>' +
                    '<button type="button" class="reply-cancel">取消</button>' +
                    '<span class="comment-msg"></span>' +
                    '</div>';
                item.appendChild(form);
                form.querySelector('.reply-nick').focus();
            }

            function submitReply(form) {
                if (form.getAttribute('data-busy')) return;
                var parentId = Number(form.getAttribute('data-parent'));
                var nick = form.querySelector('.reply-nick').value.trim();
                var content = form.querySelector('textarea').value;
                var msg = form.querySelector('.comment-msg');
                msg.className = 'comment-msg';
                function err(m) { msg.textContent = m; msg.classList.add('error'); }
                if (!nick) { err('昵称不能为空'); return; }
                if (nick.length > 20) { err('昵称不能超过 20 个字符'); return; }
                if (!content.trim() || !content.replace(/<[^>]*>/g, '').trim()) { err('回复内容不能为空'); return; }
                if (content.length > 1000) { err('回复不能超过 1000 字符'); return; }
                form.setAttribute('data-busy', '1');
                var btn = form.querySelector('.reply-submit');
                btn.disabled = true;
                btn.textContent = '提交中…';
                fetch('/api/articles/' + id + '/comments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname: nick, content: content, parent_id: parentId })
                })
                    .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
                    .then(function (r) {
                        btn.disabled = false;
                        btn.textContent = '提交回复';
                        form.removeAttribute('data-busy');
                        if (r.status === 200) {
                            localStorage.setItem('ys_nick', nick);
                            justPostedId = r.data.id || 0; // 刷新后定位到新回复
                            form.remove();
                            loadComments();
                        } else {
                            err(r.data.message || '回复发布失败，请稍后重试');
                        }
                    })
                    .catch(function () {
                        btn.disabled = false;
                        btn.textContent = '提交回复';
                        form.removeAttribute('data-busy');
                        err('回复发布失败，请稍后重试');
                    });
            }

            /* ---------- 评论列表事件委托（点赞 / 回复 / 回复表单按钮） ---------- */
            function onCommentListClick(e) {
                var t = e.target;
                if (!t || !t.closest) return;
                var like = t.closest('.cm-like');
                if (like) { toggleCommentLike(like, like.getAttribute('data-id')); return; }
                var rp = t.closest('.cm-reply');
                if (rp) { openReplyForm(rp.getAttribute('data-id')); return; }
                var cancel = t.closest('.reply-cancel');
                if (cancel) { var f = cancel.closest('.reply-form'); if (f) f.remove(); return; }
                var submit = t.closest('.reply-submit');
                if (submit) { submitReply(submit.closest('.reply-form')); }
            }
        })();
    </script>
</body>
</html>
