<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>文章详情 - yelou的个人博客</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', 'Microsoft YaHei', sans-serif; }
        body {
            background-image: url("picture/d3SJaPgZhqMVOQv.thumb.png");
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* 内容不足一屏时让页脚始终贴底 */
        .main-wrap { flex: 1 1 auto; width: 100%; }
        a { text-decoration: none; color: #3498db; }
        a:hover { color: #2980b9; }
        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
        header {
            background-color: #fff; opacity: 0.85;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px 0;
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: #2c3e50; }
        nav ul { display: flex; list-style: none; }
        nav ul li { margin-left: 20px; }
        nav ul li a { color: #2c3e50; font-weight: 500; padding: 5px 10px; border-radius: 4px; transition: background-color 0.3s; }
        nav ul li a:hover { background-color: #ecf0f1; }
        .article-wrap {
            background-color: #fff; opacity: 0.95;
            border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 36px 40px; margin: 30px 0;
        }
        .article-title { color: #2c3e50; font-size: 26px; margin-bottom: 12px; }
        .article-meta { color: #7f8c8d; font-size: 14px; margin-bottom: 8px; }
        .article-tags { margin-bottom: 22px; }
        .article-tags .tag {
            display: inline-block; background-color: #eaf2f8; color: #2980b9;
            border-radius: 4px; padding: 2px 10px; font-size: 12px; margin: 0 4px 4px 0;
        }
        .article-body { border-top: 1px solid #ecf0f1; padding-top: 24px; font-size: 15.5px; color: #34495e; word-break: break-word; }
        .article-body img { max-width: 100%; height: auto; border-radius: 6px; }
        .article-body a { word-break: break-all; }
        .article-body blockquote {
            border-left: 4px solid #3498db; background: #f8f9fa;
            padding: 10px 16px; margin: 14px 0; color: #7f8c8d;
        }
        .article-body pre {
            background: #2c3e50; color: #ecf0f1; border-radius: 6px;
            padding: 14px 16px; overflow-x: auto; margin: 14px 0;
        }
        .article-body code { font-family: Consolas, monospace; }
        .article-body h1,.article-body h2,.article-body h3,.article-body h4 { color: #2c3e50; margin: 20px 0 10px; }
        .back-bar { margin: 24px 0 0; }
        .back-bar a { color: #7f8c8d; font-size: 14px; }
        .back-bar a:hover { color: #3498db; }
        footer { background-color: #2c3e50; color: #ecf0f1; padding: 30px 0; text-align: center; }
        .copyright { font-size: 14px; }
        .post-tip { background-color: #fff; border-radius: 8px; padding: 40px 20px; text-align: center; color: #7f8c8d; margin: 30px 0; }
        /* 评论区（REQ-25 / REQ-27） */
        .comments-wrap { background-color: #fff; opacity: 0.95; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 24px 40px; margin: 0 0 30px; }
        .comments-title { color: #2c3e50; font-size: 18px; margin: 0 0 14px; }
        .comments-title .count { color: #7f8c8d; font-size: 14px; font-weight: normal; }
        .comment-item { border-top: 1px solid #ecf0f1; padding: 14px 0; }
        .comment-item:first-child { border-top: none; }
        .comment-head { font-size: 13px; color: #7f8c8d; margin-bottom: 6px; }
        .comment-head .nickname { color: #2c3e50; font-weight: bold; margin-right: 8px; }
        .comment-content { font-size: 14.5px; color: #34495e; word-break: break-word; white-space: pre-wrap; }
        .comment-empty { color: #7f8c8d; font-size: 14px; padding: 10px 0; }
        .comment-form { border-top: 1px solid #ecf0f1; margin-top: 18px; padding-top: 18px; }
        .comment-form .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .comment-form input, .comment-form textarea { flex: 1; min-width: 0; border: 1px solid #dfe4e8; border-radius: 4px; padding: 8px 10px; font-size: 14px; font-family: inherit; }
        .comment-form input:focus, .comment-form textarea:focus { outline: none; border-color: #3498db; }
        .comment-form .field-name { flex: 0 0 42%; }
        .comment-form textarea { resize: vertical; min-height: 80px; }
        .comment-form .btn-submit { background: #3498db; color: #fff; border: none; border-radius: 4px; padding: 8px 22px; font-size: 14px; cursor: pointer; touch-action: manipulation; }
        .comment-form .btn-submit:hover { background: #2980b9; }
        .comment-form .btn-submit:disabled { background: #9dc9e8; cursor: not-allowed; }
        .comment-msg { font-size: 13px; margin-top: 8px; min-height: 16px; }
        .comment-msg.error { color: #e74c3c; }
        .comment-msg.ok { color: #27ae60; }
        /* 手机端适配（≤ 768px） */
        @media (max-width: 768px) {
            .header-content { flex-direction: column; gap: 12px; }
            .logo { font-size: 20px; }
            nav ul li { margin-left: 12px; }
            .article-wrap { padding: 20px 16px; margin: 16px 0; }
            .article-title { font-size: 20px; }
            .article-body { font-size: 14.5px; }
            .comments-wrap { padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); margin: 0 0 16px; }
            .comments-title { font-size: 16px; }
            .comment-content { font-size: 14px; line-height: 1.6; }
            /* 手机端评论 UI（REQ-34 / 5.5.5）：单列表单 + 点击目标 ≥44px + 16px 字号防 iOS 自动缩放 */
            .comment-form input, .comment-form textarea { font-size: 16px; padding: 11px 12px; }
            .comment-form .row { flex-direction: column; gap: 8px; }
            .comment-form .field-name { flex: 1 1 auto; }
            .comment-form textarea { min-height: 72px; }
            .comment-form .btn-submit { width: 100%; padding: 12px; font-size: 16px; }
            .comment-msg { margin-top: 10px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo"><a href="index.html" style="color:#2c3e50;">Yelou个人博客</a></div>
                <nav>
                    <ul>
                        <li><a href="index.html">首页</a></li>
                        <li><a href="introduce.html">关于我</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <div class="container main-wrap">
        <div id="articleWrap">
            <div class="post-tip">文章加载中…</div>
        </div>
        <div id="commentWrap"></div>
        <div class="back-bar"><a href="index.html">← 返回首页</a></div>
    </div>

    <footer>
        <div class="container">
            <div class="copyright">
                <p>© 2025 yelou的个人博客. 保留所有权利.</p>
            </div>
        </div>
    </footer>

    <script>
        // 文章详情：从后端 API 加载；渲染前做前端白名单二次过滤（防 XSS 第二道防线）
        (function () {
            function esc(s) {
                return String(s == null ? '' : s)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }
            // 前端白名单渲染：移除脚本/iframe 等危险元素与事件属性
            function safeRender(html) {
                var tpl = document.createElement('template');
                tpl.innerHTML = html;
                tpl.content.querySelectorAll('script, iframe, object, embed, link, meta, style, form, input, button').forEach(function (n) { n.remove(); });
                tpl.content.querySelectorAll('*').forEach(function (el) {
                    Array.prototype.slice.call(el.attributes).forEach(function (attr) {
                        var name = attr.name.toLowerCase();
                        var val = attr.value.toLowerCase();
                        if (name.indexOf('on') === 0) el.removeAttribute(attr.name);
                        else if ((name === 'href' || name === 'src') && val.indexOf('javascript:') === 0) el.removeAttribute(attr.name);
                    });
                });
                return tpl.innerHTML;
            }
            function fmtDate(s) {
                return String(s || '').replace('T', ' ').slice(0, 16);
            }
            var id = (location.search.match(/[?&]id=(\d+)/) || [])[1];
            if (!id) {
                document.getElementById('articleWrap').innerHTML = '<div class="post-tip">文章不存在或已被删除</div>';
            } else {
                fetch('/api/articles/' + id)
                    .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
                    .then(function (r) {
                        var wrap = document.getElementById('articleWrap');
                        if (r.status !== 200) {
                            wrap.innerHTML = '<div class="post-tip">' + esc(r.data.message || '文章不存在或已被删除') + '</div>';
                            return;
                        }
                        var a = r.data.article;
                        var tags = (a.tags || '').split(',').filter(Boolean)
                            .map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; })
                            .join('');
                        document.title = a.title + ' - yelou的个人博客';
                        wrap.innerHTML =
                            '<article class="article-wrap">' +
                            '<h1 class="article-title">' + esc(a.title) + '</h1>' +
                            '<div class="article-meta">发布于: ' + fmtDate(a.created_at) + ' | 分类: ' + esc(a.category) + '</div>' +
                            (tags ? '<div class="article-tags">' + tags + '</div>' : '') +
                            '<div class="article-body">' + safeRender(a.content) + '</div>' +
                            '</article>';
                        initComments();
                    })
                    .catch(function () {
                        document.getElementById('articleWrap').innerHTML = '<div class="post-tip">文章加载失败，请稍后重试</div>';
                    });
            }

            /* ---------- 评论区（REQ-25 ~ 28 / BC-27 ~ 31） ---------- */
            function initComments() {
                document.getElementById('commentWrap').innerHTML =
                    '<div class="comments-wrap">' +
                    '<h2 class="comments-title">评论<span class="count" id="commentCount"></span></h2>' +
                    '<div id="commentList"><div class="post-tip" style="padding:14px 0;margin:0;">评论加载中…</div></div>' +
                    '<div class="comment-form">' +
                    '<div class="row">' +
                    '<input id="c-nickname" class="field-name" maxlength="20" placeholder="昵称（必填）">' +
                    '<input id="c-email" type="email" maxlength="50" placeholder="邮箱（选填）">' +
                    '</div>' +
                    '<textarea id="c-content" rows="3" maxlength="1000" placeholder="写下你的评论…（≤ 1000 字符）"></textarea>' +
                    '<div style="display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;">' +
                    '<button type="button" class="btn-submit" id="c-submit">发表评论</button>' +
                    '<div id="c-msg" class="comment-msg"></div>' +
                    '</div>' +
                    '</div>' +
                    '</div>';
                loadComments();
                document.getElementById('c-submit').addEventListener('click', submitComment);
            }

            var justPosted = false; // 5.5.5：仅当本页刚提交成功时，刷新后自动滚动定位新评论
            function renderComments(data) {
                document.getElementById('commentCount').textContent = '（' + data.count + '）';
                var list = document.getElementById('commentList');
                if (!data.comments.length) {
                    list.innerHTML = '<div class="comment-empty">暂无评论，快来抢沙发</div>';
                    justPosted = false;
                    return;
                }
                list.innerHTML = data.comments.map(function (c) {
                    return '<div class="comment-item">' +
                        '<div class="comment-head"><span class="nickname">' + esc(c.nickname) + '</span>' +
                        esc(fmtDate(c.created_at)) + '</div>' +
                        '<div class="comment-content">' + esc(c.content) + '</div>' +
                        '</div>';
                }).join('');
                if (justPosted) {
                    justPosted = false;
                    var last = list.querySelector('.comment-item:last-child');
                    if (last) last.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }

            function loadComments() {
                fetch('/api/articles/' + id + '/comments')
                    .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
                    .then(function (r) {
                        var list = document.getElementById('commentList');
                        if (!list) return;
                        if (r.status === 200) { renderComments(r.data); return; }
                        list.innerHTML = '<div class="comment-empty">' + esc(r.data.message || '评论加载失败') + '</div>';
                    })
                    .catch(function () {
                        var list = document.getElementById('commentList');
                        if (list) list.innerHTML = '<div class="comment-empty">评论加载失败，请稍后重试</div>';
                    });
            }

            var commentSubmitting = false;
            function submitComment() {
                if (commentSubmitting) return;
                var nickname = document.getElementById('c-nickname').value.trim();
                var email = document.getElementById('c-email').value.trim();
                var content = document.getElementById('c-content').value;
                var msg = document.getElementById('c-msg');
                msg.className = 'comment-msg';
                msg.textContent = '';
                // 前端校验（REQ-26 / BC-27 ~ 30），与后端规则一致
                if (!nickname) { msg.textContent = '昵称不能为空'; msg.classList.add('error'); return; }
                if (nickname.length > 20) { msg.textContent = '昵称不能超过 20 个字符'; msg.classList.add('error'); return; }
                if (!content.trim() || !content.replace(/<[^>]*>/g, '').trim()) {
                    msg.textContent = '评论内容不能为空'; msg.classList.add('error'); return;
                }
                if (content.length > 1000) { msg.textContent = '评论内容不能超过 1000 个字符'; msg.classList.add('error'); return; }
                if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    msg.textContent = '邮箱格式不正确'; msg.classList.add('error'); return;
                }
                commentSubmitting = true;
                var btn = document.getElementById('c-submit');
                btn.disabled = true;
                btn.textContent = '提交中…';
                fetch('/api/articles/' + id + '/comments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname: nickname, email: email, content: content })
                })
                    .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
                    .then(function (r) {
                        if (r.status === 200) {
                            msg.textContent = r.data.message || '评论发布成功';
                            msg.className = 'comment-msg ok';
                            document.getElementById('c-content').value = '';
                            justPosted = true; // 刷新后自动滚动到最新一条
                            loadComments();
                        } else {
                            msg.textContent = r.data.message || '评论发布失败，请稍后重试';
                            msg.className = 'comment-msg error';
                        }
                    })
                    .catch(function () {
                        msg.textContent = '评论发布失败，请稍后重试';
                        msg.className = 'comment-msg error';
                    })
                    .finally(function () {
                        commentSubmitting = false;
                        btn.disabled = false;
                        btn.textContent = '发表评论';
                    });
            }
        })();
    </script>
</body>
</html>
