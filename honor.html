<!DOCTYPE html>
<html lang="zh-CN">
	
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人成果展示</title>
    <link rel="stylesheet" href="styles.css">
	<style>
		body {
 		   font-family: Arial, sans-serif;
  		 	background-color: #f4f4f4;
  		 	margin: 0;
			padding: 0;
			background-image: url("picture/d3SJaPgZhqMVOQv.thumb.png");
    		background-size: cover;
			background-attachment: fixed;
			background-repeat: no-repeat;
			display: grid;
			grid-template-rows: 1fr auto;
			min-height: 100;
			margin: 0;
}

.container {
    max-width: 3000px;
	max-height: 2000px;
	min-height: 700px;
    margin: 50px auto;
    padding: 20px;
    background-color: #fff;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
	background-color: rgba(255,255,255,0.8);
}

h1 {
    text-align: center;
    color: #333;
}

.carousel {
    position: relative;
    max-width: 800px;
    margin: 0 auto;
    overflow: hidden;
}

.carousel-item {
    display: none;
    width: 100%;
}

.carousel-item.active {
    display: block;
}

.carousel-item img {
    width: 100%;
    height: auto;
    display: block;
}
footer {
           background-color: #2c3e50;
            color: #ecf0f1;
            padding: 30px 0;
            text-align: center;
        }

.carousel-caption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background-color: rgba(0, 0, 0, 0.5);
    color: #fff;
    padding: 10px;
    text-align: center;
}

.carousel-control {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background-color: rgba(0, 0, 0, 0.5);
    color: #fff;
    border: none;
    padding: 10px;
    cursor: pointer;
    font-size: 18px;
}

.carousel-control.prev {
    left: 10px;
}

.carousel-control.next {
    right: 10px;
}
nav ul {
            display: flex;
            list-style: none;
        }
        
        nav ul li {
            margin-left: 20px;
        }
        
        nav ul li a {
            color: #2c3e50;
            font-weight: 500;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        nav ul li a:hover {
            background-color: #ecf0f1;
        }		
	</style>
</head>
<body>
    <div class="container">
        <h1>我的成果展示</h1>
		<nav>
          <ul>
                        <li><a href="index.html" style="text-decoration: none">首页</a></li>
                    </ul>
      </nav>
        <div class="carousel">
            <div class="carousel-item active">
                <img src="picture/数学.jpg" alt="项目1">
                <div class="carousel-caption">
                    <h3>高中数学竞赛省三等奖</h3>
                </div>
            </div>
            <div class="carousel-item">
                <img src="picture/noi.png" alt="获奖证书1">
                <div class="carousel-caption">
                    <h3>noip竞赛贵州二等奖</h3>
                </div>
            </div>
            <div class="carousel-item">
                <img src="./picture/建模.jpg" alt="项目2">
                <div class="carousel-caption">
                    <h3>中学生数学建模遵义市三等奖</h3>
                </div>
            </div>
            <!-- 更多轮播项 -->
            <button class="carousel-control prev" onclick="prevSlide()">&#10094;</button>
            <button class="carousel-control next" onclick="nextSlide()">&#10095;</button>
        </div>
</div>
    <script src="script.js"></script>
	<footer>
        <p>成果展示&copy; 2025</p>
    </footer>
</body>
</html>
